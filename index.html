<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmint Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centred app column (phone to tablet). Child screens sit in a night garden lit by fireflies; the grown-up area is a clear paper report. */
  --night:#1b1938;
  --night-raised:#2a2754;
  --glow:#ffcf5c;
  --mint:#7fdcc0;
  --rose:#ff9a8f;
  --moon:#ece9ff;
  --moon-soft:#b9b5e6;
  --paper:#f3f1fa;
  --card:#ffffff;
  --ink:#1f1c3f;
  --ink-soft:#5b5884;
  --line:#dcd8ee;
  --violet:#5b43c9;
  --good:#1f7a5e;
  --warn:#9a5b06;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--moon);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.grownup{background:var(--paper);color:var(--ink);color-scheme:light}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
body.grownup #sky{display:none}
.fly{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px 3px rgba(255,207,92,.55);opacity:0;animation:drift 10s ease-in-out infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}20%{opacity:.85}50%{transform:translate(28px,-36px);opacity:.35}80%{opacity:.75}100%{transform:translate(-12px,-80px);opacity:0}}
.app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(2.1rem,6.5vw,3.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,4vw,1.8rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.eyebrow{font:700 .78rem/1.25 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--glow)}
body.grownup .eyebrow{color:var(--violet)}
.lede{font-size:1.15rem;color:var(--moon-soft);max-width:34em}
.soft{color:var(--moon-soft)}
body.grownup .soft{color:var(--ink-soft)}
.stack{display:flex;flex-direction:column;gap:16px}
.block{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font:800 1.35rem var(--font-display)}
.brand small{font:700 .7rem var(--font-body);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:999px;padding:2px 9px;opacity:.75}
.btn{appearance:none;border:0;border-radius:999px;background:var(--glow);color:var(--night);font:700 1.05rem var(--font-display);padding:12px 24px;min-height:48px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,207,92,.3)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn.small{min-height:40px;padding:8px 16px;font-size:.95rem}
.btn.big{font-size:1.25rem;padding:16px 32px;min-height:60px;align-self:center}
body.grownup .btn{background:var(--violet);color:#fff}
body.grownup .btn:hover{box-shadow:0 6px 20px rgba(91,67,201,.25)}
body.grownup .btn.ghost{background:transparent;color:var(--violet)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
body.grownup button:focus-visible,body.grownup input:focus-visible,body.grownup textarea:focus-visible,.gate button:focus-visible,.gate input:focus-visible{outline-color:var(--violet)}

/* Welcome */
.hero{display:grid;grid-template-columns:1fr 170px;gap:20px;align-items:center}
.hero-pip{display:flex;justify-content:center}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero-pip{order:-1;justify-content:flex-start}.hero-pip svg{width:92px;height:92px}}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.pillar{background:var(--night-raised);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.pillar h3{color:var(--glow)}
.pillar p{color:var(--moon-soft)}
.promise{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1.5px solid rgba(236,233,255,.32);border-radius:999px;padding:6px 14px;font-size:.92rem}
.preview{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.preview .eyebrow{color:var(--violet)}
.preview .soft{color:var(--ink-soft)}
.preview-row{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.preview-row .lv{font:800 2.4rem/1 var(--font-display);color:var(--violet);grid-row:span 2}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.who-btn{appearance:none;border:2px solid var(--glow);background:var(--night-raised);color:var(--moon);border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;font:700 1.2rem var(--font-display);text-align:left}
.who-btn small{display:block;font:400 .85rem var(--font-body);color:var(--moon-soft)}

/* Cards and forms */
.card{background:var(--night-raised);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
body.grownup .card{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(31,28,63,.05)}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .label{font-weight:700}
input[type=text]{width:100%;font:1.1rem var(--font-body);padding:12px 14px;border-radius:14px;border:2px solid rgba(236,233,255,.25);background:var(--night);color:var(--moon)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:2px solid rgba(236,233,255,.3);background:transparent;color:inherit;border-radius:999px;padding:9px 16px;font:700 1rem var(--font-body);cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--night)}
body.grownup .chip{border-color:var(--line)}
body.grownup .chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.err{color:var(--rose);min-height:1.3em;font-size:.95rem}

/* Pip */
.pip-say{display:flex;align-items:center;gap:14px}
.bubble{background:var(--moon);color:var(--night);border-radius:20px 20px 20px 6px;padding:12px 16px;font:600 1.15rem/1.35 var(--font-display);flex:1;max-width:32em;min-height:3em;display:flex;align-items:center}
.compact .bubble{font-size:1.02rem;min-height:2.6em}
.pip{flex:none;overflow:visible}
.pip.glowing{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* Child home */
ol.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{display:flex;align-items:center;gap:14px;background:var(--night-raised);border-radius:18px;padding:12px 16px;border:2px solid transparent}
.stop.next{border-color:var(--glow)}
.stop-name{display:block;font:700 1.15rem var(--font-display)}
.stop-sub{display:block;color:var(--moon-soft);font-size:.95rem}
.lantern{color:#8d89c4;flex:none}
.lantern .body{fill:var(--night);stroke:#8d89c4;stroke-width:2}
.lantern.on{color:var(--glow)}
.lantern.on .body{fill:var(--glow);stroke:var(--glow);filter:drop-shadow(0 0 8px rgba(255,207,92,.8))}
.warm{border:2px dashed rgba(255,207,92,.6)}

/* Game */
.trialbar{display:flex;gap:8px;justify-content:center}
.tdot{width:14px;height:14px;border-radius:50%;background:rgba(236,233,255,.2)}
.tdot.ok{background:var(--mint)}
.tdot.no{background:var(--rose)}
.tdot.cur{box-shadow:0 0 0 3px var(--glow)}
.board{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:320px}
.grid{display:grid;gap:10px;width:min(88vw,460px)}
.cell{aspect-ratio:1;border:0;border-radius:20px;background:var(--night-raised);cursor:pointer;font:800 1.6rem var(--font-display);color:var(--night);transition:background .15s,box-shadow .15s}
.cell:disabled{cursor:default}
.cell.lit{background:var(--glow);box-shadow:0 0 28px 6px rgba(255,207,92,.5)}
.cell.tap{background:var(--mint)}
.cell.miss{background:var(--rose)}
.pad{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4f8f7c,#2b5f53);color:#f2fff9;font:800 clamp(1.1rem,4.5vw,1.6rem) var(--font-display);cursor:pointer}
.pad.found{background:rgba(127,220,192,.14);color:rgba(242,255,249,.35);cursor:default}
.pad.hint{box-shadow:0 0 0 4px var(--glow),0 0 24px var(--glow)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.timer{font-weight:700;font-variant-numeric:tabular-nums;color:var(--moon-soft)}
.timer.over{color:var(--rose)}
.target{display:flex;align-items:baseline;gap:10px}
.t-label{font:700 1.3rem var(--font-display);color:var(--moon-soft)}
.t-num{font:800 3.8rem/1 var(--font-display);color:var(--glow)}
.sum{font:700 1.3rem var(--font-display);font-variant-numeric:tabular-nums;min-height:1.6em;text-align:center}
.sum.good{color:var(--mint)}
.sum.bad{color:var(--rose)}
.berries{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:460px}
.berry{width:76px;height:76px;border-radius:50% 50% 46% 46%;border:0;background:radial-gradient(circle at 35% 30%,#ff9db5,#c2456a);color:#fff;font:800 1.7rem var(--font-display);cursor:pointer;transition:transform .15s,box-shadow .15s;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.berry[aria-pressed="true"]{transform:translateY(-6px);box-shadow:0 0 0 4px var(--glow)}
.berry.answer{box-shadow:0 0 0 4px var(--mint),0 0 20px var(--mint)}
.berry:disabled{cursor:default}
.lantern-btn{aspect-ratio:1;border:0;border-radius:50%;background:var(--l);box-shadow:0 0 18px -2px var(--l);cursor:pointer}
.lantern-btn:disabled{cursor:default}
.lantern-btn.found{outline:4px solid var(--mint);outline-offset:3px}
.lantern-btn.miss{outline:4px solid var(--rose);outline-offset:3px}
.lantern-btn.reveal{outline:4px dashed var(--glow);outline-offset:4px}
.timebar{width:min(88vw,460px);height:8px;border-radius:99px;background:rgba(236,233,255,.15);overflow:hidden}
.timebar span{display:block;height:100%;width:100%;background:var(--glow)}
.levelnote{text-align:center;color:var(--moon-soft);font-size:.95rem}
/* Picnic */
.basket{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:520px;padding:18px;border-radius:24px;background:repeating-linear-gradient(45deg,rgba(255,154,143,.16) 0 14px,rgba(255,154,143,.07) 14px 28px)}
.item{display:flex;flex-direction:column;align-items:center;font-size:2.6rem;line-height:1.1;width:78px}
.item small{font:700 .8rem var(--font-body);color:var(--moon-soft)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:12px;width:min(88vw,420px)}
.choice{appearance:none;border:2px solid rgba(236,233,255,.3);background:var(--night-raised);color:var(--moon);border-radius:18px;padding:10px;font-size:2.2rem;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.choice small{font:700 .85rem var(--font-body);color:var(--moon-soft)}
.choice.right{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint)}
.choice.wrong{border-color:var(--rose)}
.q{font:700 1.3rem var(--font-display)}
/* Frogs */
.pond{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(88vw,420px)}
.spot{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#2f5d55,#22403f);display:grid;place-items:center;transition:box-shadow .15s}
.spot.okflash{box-shadow:0 0 0 4px var(--mint)}
.spot.badflash{box-shadow:0 0 0 4px var(--rose)}
.frog{width:74%;aspect-ratio:1;border:0;border-radius:50% 50% 44% 44%;cursor:pointer;font:800 1.6rem var(--font-display);color:#fff;display:grid;place-items:center}
.frog.go{background:radial-gradient(circle at 35% 30%,#b9f5c9,#2f9e5a);box-shadow:0 0 22px rgba(127,220,150,.6)}
.frog.stop{background:radial-gradient(circle at 35% 30%,#ffc2bb,#c9392f);border-radius:22%}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;color:var(--moon-soft)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:18px;border-radius:50%}
.legend i.g{background:#2f9e5a}
.legend i.r{background:#c9392f;border-radius:4px}
/* Which has more */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(88vw,480px)}
.side{appearance:none;border:2px solid rgba(236,233,255,.25);background:var(--night-raised);color:var(--moon);border-radius:22px;min-height:150px;padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:800 clamp(1.6rem,6vw,2.4rem) var(--font-display);font-variant-numeric:tabular-nums}
.side.right{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint)}
.side.wrong{border-color:var(--rose)}
.side small{font:700 .95rem var(--font-body);color:var(--moon-soft)}
.dotset{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:150px}
.dotset i{width:20px;height:20px;border-radius:50%;background:var(--glow)}
/* Mirror */
.mgrid{display:grid;gap:6px}
.mcell{aspect-ratio:1;border:0;border-radius:10px;background:var(--night-raised);cursor:pointer;position:relative}
.mcell.left{cursor:default;background:rgba(42,39,84,.6)}
.mcell.on{background:var(--glow);box-shadow:0 0 14px rgba(255,207,92,.6)}
.mcell.edge{box-shadow:6px 0 0 -2px var(--mint)}
.mcell.on.edge{box-shadow:6px 0 0 -2px var(--mint),0 0 14px rgba(255,207,92,.6)}
.mcell.should{outline:3px dashed var(--mint);outline-offset:-3px}
.mcell.wrongon{background:var(--rose)}

/* Result and done */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font:800 3.4rem/1 var(--font-display);color:var(--glow)}
.lvl{font-weight:700}
.lantern-row{display:flex;justify-content:center;gap:18px}
.quest h2{font-size:1.5rem}
/* Calm corner */
.calm{display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px 0}
.breath{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fff6c9 0%,var(--glow) 45%,rgba(255,207,92,0) 72%);transform:scale(.6);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.25)}
.breath.out{transform:scale(.6)}
.calm-text{font:700 1.6rem var(--font-display);text-align:center;min-height:2.2em}

/* Parental gate */
.overlay{position:fixed;inset:0;background:rgba(10,9,28,.72);display:grid;place-items:center;padding:16px;z-index:10}
.gate{background:var(--paper);color:var(--ink);border-radius:22px;padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.gate input[type=text]{background:#fff;color:var(--ink);border:2px solid var(--line)}
.gate .btn{background:var(--violet);color:#fff}
.gate .btn.ghost{background:transparent;color:var(--violet)}
.gate .err{color:#b3261e}

/* Grown-up area */
.banner{background:#fff4d6;color:#5a4200;border:1px solid #f0d58a;border-radius:14px;padding:10px 14px;font-size:.95rem}
.linkbtn{appearance:none;background:none;border:0;color:var(--violet);font:700 .95rem var(--font-body);text-decoration:underline;cursor:pointer;padding:0 4px}
.kids{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.stats div{display:flex;flex-direction:column;border-top:3px solid var(--violet);padding-top:8px}
.stats b{font:800 1.6rem var(--font-display);font-variant-numeric:tabular-nums}
.stats span{color:var(--ink-soft);font-size:.9rem}
.note{border-left:6px solid var(--glow) !important}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.skill,.lifecard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.skill header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{font:700 .8rem var(--font-body);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.up{background:#dff5ec;color:var(--good)}
.pill.down{background:#fff0d9;color:var(--warn)}
.pill.steady,.pill.new{background:#ecebf6;color:var(--ink-soft)}
.level{display:flex;align-items:baseline;gap:8px}
.level .lv{font:800 2.6rem/1 var(--font-display);color:var(--violet)}
.level .of{color:var(--ink-soft);font-size:.9rem}
.means{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.means li{font-weight:700}
.means li span{display:block;font-weight:400;color:var(--ink-soft);font-size:.85rem}
.spark{margin:0}
.spark svg{width:100%;height:auto;display:block}
.spark .g{stroke:var(--line);stroke-dasharray:3 3}
.spark .a{fill:var(--violet);opacity:.12}
.spark .l{fill:none;stroke:var(--violet);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark .d{fill:var(--violet)}
.spark .t{fill:var(--ink-soft);font:11px var(--font-body)}
.spark figcaption{font-size:.8rem;color:var(--ink-soft)}
dl{margin:0;display:flex;flex-direction:column;gap:8px}
dl div{display:grid;grid-template-columns:118px 1fr;gap:10px}
dt{color:var(--ink-soft);font-size:.9rem}
dd{margin:0;font-size:.95rem}
@media (max-width:420px){dl div{grid-template-columns:1fr;gap:0}}
.rules ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.life{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.lifecard h3{font-size:1.1rem;line-height:1.25}
.act{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0;padding-top:0}
.check{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--good);cursor:pointer;align-self:flex-start;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--good)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
tr:last-child td{border-bottom:0}
.up-t{color:var(--good);font-weight:700}
.down-t{color:var(--warn);font-weight:700}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.weekgrid div{background:var(--paper);border-radius:14px;padding:10px 12px}
.weekgrid b{display:block;font-family:var(--font-display);font-size:1.1rem}
textarea{width:100%;min-height:180px;font:.95rem/1.4 var(--font-body);border:2px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);background:#fff}
.setrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}

/* v3: new games, rewards, feedback */
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.burst{position:fixed;left:50%;top:42%;width:0;height:0;z-index:20;pointer-events:none}
.burst i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--glow);box-shadow:0 0 14px var(--glow);transform:rotate(var(--a)) translateY(0);animation:burst 1.1s ease-out var(--d) forwards}
@keyframes burst{to{transform:rotate(var(--a)) translateY(-150px) scale(.3);opacity:0}}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:560px}
.seq-item{width:56px;height:56px;border-radius:14px;background:var(--night-raised);display:grid;place-items:center}
.seq-item.ask{border:2px dashed var(--glow);font:800 1.6rem var(--font-display);color:var(--glow)}

<div id="sky" aria-hidden="true"></div>
<main id="app" class="app"></main>
<script>
(() => {
'use strict';
const KEY = 'mindmint-proto-v2', OLD_KEY = 'mindmint-proto-v1';
const SKILLS = ['memory', 'focus', 'numbers', 'noticing', 'logic', 'words'];
const SKILL_NAME = { memory: 'Memory', focus: 'Focus', numbers: 'Numbers', noticing: 'Noticing', logic: 'Logic', words: 'Words' };
const SKILL_PLAIN = {
  memory: 'Holding things in mind for a short time: working memory.',
  focus: 'Staying on task and holding back when needed: attention and self-control.',
  numbers: 'Understanding amounts and adding in your head: number sense.',
  noticing: 'Spotting details and seeing patterns in space: visual attention.',
  logic: 'Finding rules and switching between them: reasoning and flexible thinking.',
  words: 'Sorting and building words: vocabulary and early reading.'
};
const SKILL_GAMES = { memory: ['trail', 'picnic'], focus: ['lily', 'frogs'], numbers: ['berry', 'more'], noticing: ['odd', 'mirror'], logic: ['next', 'sort'], words: ['cat', 'word'] };
const MAX_KIDS = 4;
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = s => document.querySelector(s);
const app = $('#app');

/* ---------- Level rules: each maps a skill level (1 to 10) to that game's settings ---------- */
const TRAIL = l => ({ grid: l <= 3 ? 3 : 4, len: Math.min(l + 1, 9), speed: Math.max(420, 720 - l * 30) });
const PICNIC = l => ({ n: Math.min(l + 2, 10), show: Math.max(2600, 5200 - l * 250), moved: l >= 3 });
const LILY = l => { const n = l <= 2 ? 3 : l <= 5 ? 4 : 5; const cells = n * n; return { n, cells, limit: Math.max(Math.round(cells * 1.1), Math.round(cells * (2.6 - 0.13 * l))) }; };
const FROGS = l => ({ win: Math.max(650, 1500 - l * 85), nogo: Math.min(0.4, 0.22 + l * 0.02), count: 10 });
const BERRY = l => [[5, 2], [10, 2], [10, 3], [20, 2], [20, 3], [30, 3], [50, 2], [50, 3], [100, 2], [100, 3]][l - 1];
const MORE_DESC = ['compares groups of up to 5 dots', 'compares groups of up to 10 dots', 'compares numbers up to 20', 'compares two-digit numbers', 'compares a small sum with a number', 'compares two small sums', 'compares two-digit sums with numbers', 'compares two sums up to 100', 'compares two subtractions', 'compares two times-table facts'];
const ODD = l => ({ n: [2, 3, 3, 4, 4, 5, 5, 5, 6, 6][l - 1], d: [26, 22, 18, 16, 13, 12, 10, 8, 7, 6][l - 1] });
const MIRROR = l => { const t = [[2, 4, 2], [3, 4, 3], [3, 6, 4], [4, 6, 5], [4, 6, 6], [4, 8, 7], [5, 8, 8], [5, 8, 10], [6, 8, 11], [6, 10, 13]][l - 1]; return { rows: t[0], cols: t[1], k: t[2] }; };
const NEXT_DESC = ['continues a two-colour pattern', 'continues a three-part colour pattern', 'continues a three-shape pattern', 'continues a growing pattern', 'continues a number pattern that adds 2', 'continues a pattern where shape and colour change separately', 'continues number patterns that add or subtract', 'continues doubling patterns', 'continues patterns with alternating steps', 'continues two patterns woven together'];
const SORT = l => ({ mode: l <= 4 ? 'word' : l <= 6 ? 'icon' : 'border', every: [0, 0, 4, 3, 3, 0, 0, 0, 0, 0][l - 1], once: l === 2, random: l === 6, limit: [0, 0, 0, 0, 0, 0, 0, 3200, 2600, 2100][l - 1] });
const SORT_DESC = ['sorts cards by one rule (colour)', 'switches from sorting by colour to sorting by shape', 'switches rules every 4 cards', 'switches rules every 3 cards', 'switches rules every 3 cards with only a symbol as the cue', 'switches rules on any card with only a symbol as the cue', 'follows a two-part rule: border means shape, no border means colour', 'uses the two-part rule within 3.2 seconds per card', 'uses the two-part rule within 2.6 seconds per card', 'uses the two-part rule within 2.1 seconds per card'];
const CATS = [{ tag: 'animal', label: 'animals', n: 6, k: 2 }, { tag: 'fruit', label: 'fruits', n: 6, k: 3 }, { tag: 'wheels', label: 'things with wheels', n: 9, k: 3 }, { tag: 'wear', label: 'things you wear', n: 9, k: 4 }, { tag: 'fruit', label: 'fruits (not vegetables)', n: 9, k: 4, pool: ['veg'] }, { tag: 'flies', label: 'things that fly', n: 12, k: 4 }, { tag: 'water', label: 'things found in water', n: 12, k: 4 }, { tag: 'veg', label: 'vegetables (not fruits)', n: 12, k: 5, pool: ['fruit'] }, { tag: 'wheels', label: 'things with wheels', n: 16, k: 5 }, { tag: 'flies', label: 'things that fly', n: 16, k: 5 }];
const WORD = l => { const t = [[3, 0, true], [3, 0, false], [4, 0, false], [4, 1, false], [5, 0, false], [5, 2, false], [6, 0, false], [6, 2, false], [7, 0, false], [7, 3, false]][l - 1]; return { len: t[0], extra: t[1], ghost: t[2] }; };
const diffWord = d => d >= 18 ? 'big' : d >= 12 ? 'medium' : d >= 8 ? 'small' : 'tiny';
const noTimer = () => !!(P() && P().child.noTimer);

const GAMES = {
  trail: { name: 'Firefly Trail', skill: 'memory', trials: 5, what: 'remembering the order of places',
    meaning: l => { const c = TRAIL(l); return `remembers a ${c.len}-step path on a ${c.grid}×${c.grid} grid`; }, kid: l => `paths of ${TRAIL(l).len} steps` },
  picnic: { name: 'Picnic Recall', skill: 'memory', trials: 5, what: 'remembering a group of things',
    meaning: l => { const c = PICNIC(l); return `spots which of ${c.n} picnic items went missing${c.moved ? ', even after they are moved around' : ''}`; }, kid: l => `${PICNIC(l).n} picnic things` },
  lily: { name: 'Lily Pad Count-Up', skill: 'focus', trials: 3, what: 'finding numbers in order, quickly and carefully',
    meaning: l => { const c = LILY(l); return noTimer() ? `finds 1 to ${c.cells} in order (no time limit)` : `finds 1 to ${c.cells} in order within ${c.limit} seconds`; }, kid: l => `numbers up to ${LILY(l).cells}` },
  frogs: { name: 'Stop & Go Frogs', skill: 'focus', trials: 3, what: 'tapping at the right time and holding back at the wrong time',
    meaning: l => noTimer() ? 'taps green frogs and holds back on red ones (relaxed pace)' : `taps green frogs and holds back on red ones, with ${(FROGS(l).win / 1000).toFixed(1)} seconds to decide`, kid: l => (noTimer() ? 'slow frogs' : `${(FROGS(l).win / 1000).toFixed(1)}-second frogs`) },
  berry: { name: 'Berry Sums', skill: 'numbers', trials: 5, what: 'making a total by adding numbers',
    meaning: l => { const [m, k] = BERRY(l); return `makes totals up to ${m} using ${k} numbers`; }, kid: l => `totals up to ${BERRY(l)[0]}` },
  more: { name: 'Which Has More?', skill: 'numbers', trials: 6, what: 'comparing amounts and numbers',
    meaning: l => MORE_DESC[l - 1], kid: l => MORE_DESC[l - 1].replace('compares ', '') },
  odd: { name: 'Odd Glow Out', skill: 'noticing', trials: 6, what: 'spotting the one thing that is different',
    meaning: l => { const c = ODD(l); return `spots 1 different lantern among ${c.n * c.n} (${diffWord(c.d)} difference)`; }, kid: l => `${ODD(l).n * ODD(l).n} lanterns` },
  mirror: { name: 'Mirror Garden', skill: 'noticing', trials: 4, what: 'copying a pattern as a mirror image',
    meaning: l => { const c = MIRROR(l); return `mirrors a pattern of ${c.k} flowers on a ${c.rows}×${c.cols} grid`; }, kid: l => `${MIRROR(l).k}-flower patterns` },
  next: { name: 'What Comes Next?', skill: 'logic', trials: 6, what: 'finding the rule in a pattern',
    meaning: l => NEXT_DESC[l - 1], kid: l => NEXT_DESC[l - 1].replace('continues ', '') },
  sort: { name: 'Sort Switch', skill: 'logic', trials: 3, what: 'sorting by a rule, then switching rules',
    meaning: l => (noTimer() && l >= 8) ? SORT_DESC[6] + ' (no time limit)' : SORT_DESC[l - 1], kid: l => (SORT(l).mode === 'border' ? 'two-part rules' : SORT(l).every || SORT(l).once || SORT(l).random ? 'switching rules' : 'one rule') },
  cat: { name: 'Category Catch', skill: 'words', trials: 4, what: 'finding everything that belongs to a group',
    meaning: l => `finds all the ${CATS[l - 1].label} among ${CATS[l - 1].n} pictures`, kid: l => CATS[l - 1].label },
  word: { name: 'Word Builder', skill: 'words', trials: 4, what: 'building a word, sound by sound',
    meaning: l => { const c = WORD(l); return `spells ${c.len}-letter words from a picture${c.extra ? ` with ${c.extra} extra letter${c.extra > 1 ? 's' : ''} mixed in` : c.ghost ? ' with letter hints' : ''}`; }, kid: l => `${WORD(l).len}-letter words` }
};

/* Strategies: the first option is always the stronger trick; the third is the weaker one. */
const STRATS = {
  trail: { q: 'What helped you remember the path?', best: 'See the path as a shape', opts: [['shape', 'I saw it as a shape'], ['say', 'I said the places in my head'], ['watch', 'I just watched closely']],
    tip: { shape: 'Great trick! Turning a path into a shape, like an L or a zigzag, makes it easier to hold.', say: 'Saying it in your head is a real memory trick. Try adding the shape trick too!', watch: 'Next time, try seeing the path as a shape, like a letter L or a zigzag.', none: 'Here is a trick to try: see the path as a shape, like a letter L or a zigzag.' },

/* Spaced comebacks: focus skills every day; other skills return after growing gaps (1, 2, 4, then 7 days). */
function nextDue(p, skill) {
  if (p.child.focus.includes(skill)) return { due: true, overdue: 0, label: 'every day (a focus skill)' };
  const entries = p.log.filter(e => e.skill === skill);
  if (!entries.length) return { due: true, overdue: 99, label: 'not started yet, joins soon' };
  const days = new Set(entries.map(e => dk(e.ts))).size;
  const gap = [1, 2, 4, 7][Math.min(days - 1, 3)];
  const left = gap - daysBetween(entries[entries.length - 1].ts, Date.now());
  return { due: left <= 0, overdue: -left, gap, label: left <= 0 ? `due now (review gap: ${gap} day${gap > 1 ? 's' : ''})` : `in ${left} day${left > 1 ? 's' : ''} (review gap: ${gap} day${gap > 1 ? 's' : ''})` };

function buildPlan(p) {
  const count = { 5: 2, 10: 3, 15: 4 }[p.child.minutes] || 3;
  const skills = p.child.focus.slice(0, 2).slice(0, count);
  const rest = SKILLS.filter(s => !skills.includes(s)).map(s => ({ s, d: nextDue(p, s) })).sort((a, b) => (b.d.due - a.d.due) || (b.d.overdue - a.d.overdue));
  while (skills.length < count && rest.length) skills.push(rest.shift().s);
  return skills.map(s => pickGame(p, s));
}

  const others = shuffle(Object.keys(STRATS).filter(g => GAMES[g].skill !== prev.skill).map(g => STRATS[g].best)).slice(0, 2);
  return { game: prev.game, correct, opts: shuffle([correct, ...others]), answer: null };
}

/* ---------- Parent view ---------- */

function spark(pts) {
  const W = 280, H = 64, n = pts.length;
  const X = i => 26 + i * (W - 34) / (n - 1), Y = v => 8 + (10 - v) / 9 * (H - 16);
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const area = `${line} L${X(n - 1).toFixed(1)} ${Y(1).toFixed(1)} L${X(0).toFixed(1)} ${Y(1).toFixed(1)} Z`;
  return `<figure class="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Level after each of the last ${n - 1} sessions, from ${pts[0]} to ${pts[n - 1]}">
    <line x1="26" x2="${W - 8}" y1="${Y(10)}" y2="${Y(10)}" class="g"/><line x1="26" x2="${W - 8}" y1="${Y(1)}" y2="${Y(1)}" class="g"/>
    <text x="0" y="${Y(10) + 4}" class="t">L10</text><text x="0" y="${Y(1) + 4}" class="t">L1</text>
    <path d="${area}" class="a"/><path d="${line}" class="l"/><circle cx="${X(n - 1)}" cy="${Y(pts[n - 1])}" r="4.5" class="d"/></svg>
    <figcaption>Level at the start, then after each of the last ${n - 1} sessions</figcaption></figure>`;
}
function changesText(e) {
  const ups = e.changes.filter(c => c.dir === 'up').length, downs = e.changes.filter(c => c.dir === 'down').length;
  if (!ups && !downs) return e.levelEnd === 10 ? 'Already at the top level.' : 'No change: right answers never came two in a row.';
  const parts = [];
  if (ups) parts.push(`up ${ups} step${ups > 1 ? 's' : ''} (two right in a row${ups > 1 ? ', ' + ups + ' times' : ''})`);
  if (downs) parts.push(`down ${downs} step${downs > 1 ? 's' : ''} (after ${downs} miss${downs > 1 ? 'es' : ''})`);
  return 'Went ' + parts.join(' and ') + '.';
}
function skillCard(p, s) {
  const lv = p.skills[s].level;
  const hist = p.log.filter(e => e.skill === s);
  const last = hist[hist.length - 1];
  const recent = hist.slice(-12);
  const pts = recent.length ? [recent[0].levelStart, ...recent.map(e => e.levelEnd)] : [];
  const trend = last ? (last.levelEnd > last.levelStart ? 'up' : last.levelEnd < last.levelStart ? 'down' : 'steady') : 'new';
  const pill = { up: 'Moved up', down: 'Eased off', steady: 'Steady', new: 'Not played yet' }[trend];
  const inToday = p.today && p.today.date === todayKey() && p.today.plan.some(g => GAMES[g].skill === s);
  const due = inToday ? { label: "in today's plan" } : nextDue(p, s);
  return `<article class="skill">
    <header><div><p class="eyebrow">${SKILL_NAME[s]}</p><div class="level"><span class="lv">${lv}</span><span class="of">of 10</span></div></div><span class="pill ${trend}">${pill}</span></header>
    <p class="soft">${SKILL_PLAIN[s]}</p>
    <ul class="means">${SKILL_GAMES[s].map(g => `<li>${esc(p.child.name)} ${GAMES[g].meaning(lv)}<span>in ${GAMES[g].name}</span></li>`).join('')}</ul>
    ${pts.length > 2 ? spark(pts) : ''}
    <dl>
      ${last ? `<div><dt>Last session</dt><dd>${GAMES[last.game].name}: ${last.correct} of ${last.trials} right · ${fmtSec(last.avgMs)} per try · ${fmtDate(last.ts)}</dd></div>
      <div><dt>Why the level changed</dt><dd>${changesText(last)}</dd></div>
      <div><dt>Trick they used</dt><dd>${last.strategy ? STRATS[last.game].name[last.strategy] : 'not answered'}</dd></div>` : ''}
      <div><dt>Comes back</dt><dd>${due.label}</dd></div>
    </dl>
  </article>`;
}
function lifeCard(p, s) {
  const wk = weekKey(), q = (p.quests[wk] || {});
  return `<article class="lifecard"><p class="eyebrow">${SKILL_NAME[s]}</p>${LIFE[s].map((a, i) => {
    const id = `${s}-${i}`;
    return `<div class="act"><h3>${a.parent}</h3><p class="soft">Same skill as ${GAMES[a.game].name}.</p><p><strong>Ask:</strong> ${a.ask}</p>
    <label class="check" for="q-${id}"><input type="checkbox" id="q-${id}" data-act="quest" data-k="${id}" ${q[id] ? 'checked' : ''}><span>Tried it this week</span></label></div>`;
  }).join('')}</article>`;
}

function weekData(p) {
  const ws = weekStart(), entries = p.log.filter(e => e.ts >= ws);
  const days = new Set(entries.map(e => dk(e.ts))).size;
  const mins = Math.round(entries.reduce((a, e) => a + durOf(e), 0) / 60000);
  const skills = SKILLS.map(s => { const es = entries.filter(e => e.skill === s); return { s, from: es.length ? es[0].levelStart : null, to: p.skills[s].level, played: es.length }; });
  const q = p.quests[weekKey()] || {}, tried = Object.values(q).filter(Boolean).length;
  const weakest = skills.filter(x => x.played).sort((a, b) => (a.to - (a.from || a.to)) - (b.to - (b.from || b.to)))[0];
  return { entries, days, mins, skills, tried, weakest };
}
function weekText(p) {
  const w = weekData(p), name = p.child.name;
  const lines = [`Mindmint weekly update: ${name}, week of ${fmtDate(weekStart())}`, '', `Practised on ${w.days} of 7 days, about ${w.mins} minutes in total.`];
  w.skills.forEach(x => {
    const g = GAMES[SKILL_GAMES[x.s][0]];
    if (x.played) lines.push(`${SKILL_NAME[x.s]}: level ${x.from} → ${x.to}. Now ${g.meaning(x.to)} (${g.name}).`);
    else lines.push(`${SKILL_NAME[x.s]}: not practised this week (level ${x.to}).`);
  });
  lines.push(`Everyday activities tried: ${w.tried} of ${SKILLS.length * 2}.`);
  if (w.weakest) { const a = LIFE[w.weakest.s][0]; lines.push('', `Idea for next week (${SKILL_NAME[w.weakest.s]}): ${a.parent}`); }
  lines.push('', 'Levels describe these exact activities only. They are not an IQ score or a school grade.');
  return lines.join('\n');
}

const waLink = t => 'https://wa.me/?text=' + encodeURIComponent(t);
function funSummary(p) {
  const by = {};
  p.log.forEach(e => { if (e.fun == null) return; (by[e.game] = by[e.game] || []).push(e.fun); });
  return Object.entries(by).map(([g, v]) => ({ g, avg: v.reduce((a, b) => a + b, 0) / v.length, n: v.length })).sort((a, b) => b.avg - a.avg);
}
function funLine(p) {
  const f = funSummary(p), loved = f.filter(x => x.avg >= 1.5).slice(0, 3).map(x => GAMES[x.g].name), meh = f.filter(x => x.avg < 1).map(x => GAMES[x.g].name);
  if (!f.length) return '';
  return (loved.length ? `Loved: ${loved.join(', ')}.` : '') + (meh.length ? ` Not keen on: ${meh.join(', ')}.` : '');
}
function feedbackText(p) {
  const f = S.fb || {}, days = new Set(p.log.map(e => dk(e.ts))).size;
  const label = { yes: 'Yes', notyet: 'Not yet', maybe: 'Maybe', no: 'No' };
  const lines = ['Mindmint prototype feedback', '', `Child's age band: ${p.child.band.replace('-', ' to ')}`, `Played on ${days} day${days === 1 ? '' : 's'}, ${p.log.length} game${p.log.length === 1 ? '' : 's'} in total`];
  if (f.enjoy) lines.push(`Child enjoyed it: ${f.enjoy} out of 5`);
  if (f.useful) lines.push(`Levels and parent notes were useful: ${f.useful} out of 5`);
  if (f.tried) lines.push(`Tried an everyday activity: ${label[f.tried]}`);
  if (f.pay) lines.push(`Would pay about ₹199 a month: ${label[f.pay]}`);

  if (f.text && f.text.trim()) lines.push('', `Comments: ${f.text.trim()}`);
  return lines.join('\n');
}

function noteCard(p, todays) {
  const name = esc(p.child.name);
  const up = todays.filter(e => e.levelEnd > e.levelStart);
  const hard = todays.filter(e => e.correct / e.trials < 0.6);
  const weak = todays.find(e => e.strategy && isWeak(e.game, e.strategy));
  let head, body, say;
  if (up.length) {
    const e = up[0], g = GAMES[e.game];
    head = `${GAME_ICON[e.game]} ${SKILL_NAME[g.skill]} went up to level ${e.levelEnd}`;
    body = `In ${g.name}, ${name} now ${g.meaning(e.levelEnd)}.` + (e.strategy && e.strategy !== 'none' ? ` They said they ${STRATS[e.game].name[e.strategy]}.` : '') + ' Naming the trick helps them use it again.';
    say = `"What trick helped you on ${g.name.replace(/\?$/, '')}?"`;
  } else if (hard.length) {
    const e = hard[0], g = GAMES[e.game];
    head = `${GAME_ICON[e.game]} ${g.name} was a stretch`;
    body = `${e.correct} of ${e.trials} right, so the game eased off to level ${e.levelEnd}. That's the plan working: practice should feel winnable.`;
    say = '"I liked how you kept going on the hard ones."';
  } else {
    const e = todays[0], a = LIFE[e.skill].find(x => x.game === e.game) || LIFE[e.skill][0];
    head = '🌱 A steady session';
    body = 'Levels held where they were. Steady days are how the next step gets built.';
    say = a.ask;
  }
  const model = weak ? `<p><strong>One thing to model:</strong> in ${GAMES[weak.game].name}, ${name} ${STRATS[weak.game].name[weak.strategy]}. Show them: "${STRATS[weak.game].best}".</p>` : '';
  const t = p.today && p.today.date === dk(todays[0].ts) ? p.today : null;
  const warm = t && t.warm && t.warm.answer ? `<p><strong>Warm-up:</strong> ${t.warm.answer === t.warm.correct ? '✅ remembered yesterday\'s trick.' : `💡 didn't recall "${t.warm.correct}". Mention it before tomorrow.`}</p>` : '';

}

let token = 0;
function dots(n, results) {

  el.innerHTML = Array.from({ length: n }, (_, i) => `<span class="tdot ${i < results.length ? (results[i] ? 'ok' : 'no') : i === results.length ? 'cur' : ''}"></span>`).join('');

async function trailTrial(board, l, ui) {
  const c = TRAIL(l), N = c.grid * c.grid;
  board.innerHTML = `<div class="grid" style="grid-template-columns:repeat(${c.grid},1fr)">${Array.from({ length: N }, (_, i) => `<button class="cell" data-i="${i}" aria-label="Spot ${i + 1}" disabled></button>`).join('')}</div>`;
  const cells = [...board.querySelectorAll('.cell')];
  const path = shuffle([...Array(N).keys()]).slice(0, c.len);
  ui.say('Watch the fireflies…');
  await wait(900);
  for (const i of path) {
    if (!ui.alive()) return { correct: false, ms: 0 };
    cells[i].classList.add('lit'); await wait(c.speed); cells[i].classList.remove('lit'); await wait(180);
  }
  ui.say('Your turn. Tap the same path.');
  cells.forEach(b => { b.disabled = false; });
  const t0 = performance.now();
  return new Promise(resolve => {
    let step = 0, over = false;
    board.onclick = async e => {
      const b = e.target.closest('.cell'); if (!b || over) return;
      const i = +b.dataset.i;
      if (i === path[step]) {
        b.classList.add('tap'); setTimeout(() => b.classList.remove('tap'), 250); step++; sfx('tap');
        if (step === path.length) { over = true; cells.forEach(x => { x.disabled = true; }); resolve({ correct: true, ms: performance.now() - t0 }); }
      } else {
        over = true; cells.forEach(x => { x.disabled = true; }); b.classList.add('miss');
        ui.say("Let's watch it again, slowly.");
        await wait(700); b.classList.remove('miss');
        for (let s = 0; s < path.length; s++) {
          if (!ui.alive()) break;
          const cell = cells[path[s]]; cell.classList.add('lit'); cell.textContent = s + 1; await wait(650); cell.classList.remove('lit');
        }
        await wait(700);
        resolve({ correct: false, ms: performance.now() - t0 });
      }
    };
  });
}

async function picnicTrial(board, l, ui) {
  const c = PICNIC(l), pool = shuffle(ITEMS.slice()), items = pool.slice(0, c.n), missing = rand(0, c.n - 1);
  const show = it => `<span class="item">${it[0]}<small>${it[1]}</small></span>`;
  board.innerHTML = `<div class="basket" aria-label="Picnic items">${items.map(show).join('')}</div>`;
  ui.say('Look at the picnic! Remember everything.');
  await wait(c.show);
  if (!ui.alive()) return { correct: false, ms: 0 };
  const left = items.filter((_, i) => i !== missing), shown = c.moved ? shuffle(left.slice()) : left;
  const choices = shuffle([items[missing], ...pool.slice(c.n, c.n + 3)]);
  board.innerHTML = `<div class="basket">${shown.map(show).join('')}</div><p class="q">What went missing?</p><div class="choices">${choices.map((it, i) => `<button class="choice" data-i="${i}">${it[0]}<small>${it[1]}</small></button>`).join('')}</div>`;
  ui.say(c.moved ? 'Everything got mixed up! What went missing?' : 'What went missing?');
  const t0 = performance.now(), btns = [...board.querySelectorAll('.choice')], ans = choices.indexOf(items[missing]);
  return new Promise(resolve => {
    let over = false;
    board.onclick = async e => {
      const b = e.target.closest('.choice'); if (!b || over) return; over = true;
      btns.forEach(x => { x.disabled = true; });
      const i = +b.dataset.i;
      if (i === ans) { b.classList.add('right'); resolve({ correct: true, ms: performance.now() - t0 }); }
      else { b.classList.add('wrong'); btns[ans].classList.add('right'); ui.say(`It was the ${items[missing][1]}.`); await wait(1600); resolve({ correct: false, ms: performance.now() - t0 }); }
    };
  });
}

function lilyTrial(board, l, ui) {
  const c = LILY(l), relaxed = noTimer();

  board.innerHTML = `<p class="q">Tap all the <strong>${c.label}</strong></p><div class="grid catgrid" style="grid-template-columns:repeat(${cols},1fr)">${items.map((it, i) => `<button class="catitem" data-i="${i}" aria-pressed="false">${it.e}<small>${it.n}</small></button>`).join('')}</div><div class="row" style="justify-content:center"><span class="soft" id="cat-count">Found 0 of ${c.k}</span><button class="btn small ghost" id="cat-done">I'm done</button></div>`;
  ui.say(`Find all the ${c.label}. There are ${c.k}.`);
  const t0 = performance.now(), btns = [...board.querySelectorAll('.catitem')], isT = i => targets.includes(items[i]);
  let found = 0, errors = 0;
  return new Promise(resolve => {
    let over = false;
    const finish = async ok => {
      if (over) return; over = true;
      btns.forEach(b => { b.disabled = true; }); board.querySelector('#cat-done').disabled = true;
      if (!ok) { btns.forEach((b, i) => { if (isT(i) && b.getAttribute('aria-pressed') !== 'true') b.classList.add('missed'); }); ui.say(found < c.k ? `The dashed ones are ${c.label} too.` : 'All found, with a few extra taps.'); await wait(1900); }
      resolve({ correct: ok, ms: performance.now() - t0 });
    };
    board.querySelector('.catgrid').onclick = e => {
      const b = e.target.closest('.catitem'); if (!b || over || b.getAttribute('aria-pressed') === 'true' || b.classList.contains('nope')) return;
      const i = +b.dataset.i;
      if (isT(i)) { b.setAttribute('aria-pressed', 'true'); found++; sfx('tap'); board.querySelector('#cat-count').textContent = `Found ${found} of ${c.k}`; if (found === c.k) finish(errors <= 1); }
      else { errors++; b.classList.add('nope', 'shake'); setTimeout(() => b.classList.remove('shake'), 400); ui.say(`The ${items[i].n} is not one of the ${c.label}.`); }
    };
    board.querySelector('#cat-done').onclick = () => finish(false);
  });
}

function wordTrial(board, l, ui) {
  const c = WORD(l), [w, pic] = pick(WORDS[c.len]);
  const extras = Array.from({ length: c.extra }, () => pick('abcdefghiklmnoprstuw'.split('')));
  const tiles = shuffle([...w.split(''), ...extras]);
  board.innerHTML = `<div class="word-pic" role="img" aria-label="Picture clue">${pic}</div><div class="slots">${w.split('').map(ch => `<span class="slot">${c.ghost ? `<span class="ghost">${ch}</span>` : ''}</span>`).join('')}</div><div class="tiles">${tiles.map((ch, i) => `<button class="tile" data-i="${i}">${ch}</button>`).join('')}</div>`;
  ui.say('Spell the word for this picture.');
  const p = P(); if (p && p.child.readAloud) setTimeout(() => { if (ui.alive()) speak(w); }, 1800);
  const t0 = performance.now(), slots = [...board.querySelectorAll('.slot')], btns = [...board.querySelectorAll('.tile')];
  let pos = 0, errors = 0;
  return new Promise(resolve => {
    let over = false;
    board.querySelector('.tiles').onclick = async ev => {
      const b = ev.target.closest('.tile'); if (!b || over || b.disabled) return;
      if (b.textContent === w[pos]) {
        b.disabled = true; b.classList.add('used'); slots[pos].textContent = w[pos]; slots[pos].classList.add('filled'); pos++; sfx('tap');
        if (pos === w.length) { over = true; btns.forEach(x => { x.disabled = true; }); resolve({ correct: errors <= 1, ms: performance.now() - t0, note: errors <= 1 ? null : `You spelled ${w}! A few wrong letters on the way.` }); }
      } else {
        errors++; b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400);
        if (errors >= 3) {
          over = true; btns.forEach(x => { x.disabled = true; });
          for (let i = pos; i < w.length; i++) { slots[i].textContent = w[i]; slots[i].classList.add('shown'); }
          ui.say(`The word is ${w}. Say it slowly: ${w.split('').join(', ')}.`); await wait(2400);
          resolve({ correct: false, ms: performance.now() - t0 });
        } else ui.say(errors === 1 ? 'Not that letter. Say the word slowly. Which sound comes next?' : `Next comes the letter ${w[pos]}.`);
      }
    };
  });
}
const TRIALS = { trail: trailTrial, picnic: picnicTrial, lily: lilyTrial, frogs: frogsTrial, berry: numbersTrial, more: moreTrial, odd: oddTrial, mirror: mirrorTrial, next: nextTrial, sort: sortTrial, cat: catTrial, word: wordTrial };

function showIntro(k, board, ui) {
  const steps = HOWTO[k];
  board.innerHTML = `<div class="intro"><div class="intro-ico" aria-hidden="true">${GAME_ICON[k]}</div><div class="howto">${steps.map(([ic, tx]) => `<div class="step"><span class="step-ico" aria-hidden="true">${ic}</span><span>${tx}</span></div>`).join('<span class="arrow" aria-hidden="true">→</span>')}</div><button class="btn big play" id="go">▶ Go</button></div>`;
  ui.say(steps.map(x => x[1].replace(/[.?]$/, '')).join('. ') + (/\?$/.test(steps[steps.length - 1][1]) ? '?' : '.'));
  const go = board.querySelector('#go'); go.focus();
  return new Promise(res => { go.onclick = () => res(); });
}
function flash(ok) {
  if (reduced) return;
  const el = document.createElement('div'); el.className = 'flash ' + (ok ? 'ok' : 'no'); el.textContent = ok ? '✓' : '↻'; el.setAttribute('aria-hidden', 'true');
  document.body.appendChild(el); setTimeout(() => el.remove(), 750);
}
async function play(k) {
  const my = ++token, p = P();
  S.playing = k; S.screen = 'game'; render();
  const g = GAMES[k], sk = p.skills[g.skill], start = sk.level, changes = [], times = [], results = [], began = Date.now();
  const board = $('#board');
  const ui = { say: t => { const el = $('#say'); if (el) el.textContent = t; speak(t); }, alive: () => my === token };
  $('#levelnote').innerHTML = meter(sk.level);
  await showIntro(k, board, ui);
  if (!ui.alive()) return;
  for (let i = 0; i < g.trials; i++) {
    if (!ui.alive()) return;
    dots(g.trials, results);
    $('#levelnote').innerHTML = meter(sk.level);
    const r = await TRIALS[k](board, sk.level, ui);
    if (!ui.alive()) return;
    results.push(r.correct); times.push(r.ms);
    let line;
    if (r.correct) {
      sk.streak++;
      line = pick(['Yes!', 'Great!', 'Nice!', 'You got it!']); sfx('ok');
      if (sk.streak >= 2) { sk.streak = 0; if (sk.level < 10) { sk.level++; changes.push({ dir: 'up', to: sk.level }); line = `⬆ Level up! Level ${sk.level}`; setTimeout(() => { sfx('up'); celebrate(); }, 250); } }
    } else {
      sk.streak = 0;
      line = r.note || pick(['Good try!', 'Nearly!']); sfx('miss');
      if (sk.level > 1) { sk.level--; changes.push({ dir: 'down', to: sk.level }); line += ' ⬇ Easier next.'; }
    }
    ui.say(line); flash(r.correct); dots(g.trials, results); $('#levelnote').innerHTML = meter(sk.level);
    await wait(1400);
  }
  const entry = { ts: Date.now(), game: k, skill: g.skill, trials: g.trials, correct: results.filter(Boolean).length, results, levelStart: start, levelEnd: sk.level, changes, avgMs: Math.round(times.reduce((a, b) => a + b, 0) / times.length), durMs: Date.now() - began, strategy: null, fun: null };
  p.log.push(entry);
  const t = ensureToday(p); if (!t.done.includes(k)) t.done.push(k);
  S.current = entry; S.screen = 'result'; save(); render();
}

function goDone() {
  const p = P(), t = ensureToday(p);
  if (t.plan.every(k => t.done.includes(k)) && !t.awarded) {
    const f = FRIENDS[p.friends.length % FRIENDS.length];
    p.friends.push({ name: f[0], hue: f[1], ts: Date.now() }); t.awarded = f[0]; save();
    setTimeout(() => { sfx('done'); celebrate(); }, 200);
  }
  S.screen = 'done'; render();
}
async function runCalm() {
  const my = ++token;
  const steps = [];
  for (let i = 0; i < 3; i++) steps.push(['Breathe in…', 'in'], ['Breathe out…', 'out']);
  await wait(1200);
  for (const [text, cls] of steps) {
    if (my !== token) return;
    const b = $('#breath'), t = $('#calm-text'); if (!b || !t) return;
    b.className = 'breath ' + cls; t.textContent = text; speak(text);
    await wait(4500);
  }
  if (my !== token) return;
  const t = $('#calm-text'); if (t) { t.textContent = 'Well done. Your glow is calm and bright.'; speak(t.textContent); }
}

/* ---------- Parental gate ---------- */
function openGate() {
  const a = rand(6, 9), b = rand(6, 9);
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `<form class="gate" id="gate-form" role="dialog" aria-modal="true" aria-labelledby="gate-title" novalidate>
    <h2 id="gate-title">For grown-ups</h2>

    <p class="err" id="gate-err" role="alert"></p>
    <div class="row"><button class="btn" type="submit">Open parent area</button><button class="btn ghost" type="button" id="gate-cancel">Cancel</button></div></form>`;
  document.body.appendChild(wrap);
  const input = wrap.querySelector('#gate-answer'); input.focus();

  wrap.querySelector('#gate-form').onsubmit = e => {

/* ---------- Example data ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function loadDemo() {
  token++;
  Object.keys(S.profiles).forEach(id => { if (S.profiles[id].demo) delete S.profiles[id]; });
  const id = 'demo-asha';
  const p = { id, created: Date.now(), demo: true, child: { name: 'Asha', band: '7-9', focus: ['memory', 'numbers'], minutes: 10, readAloud: false, noTimer: false, sounds: true }, skills: freshSkills(2), log: [], quests: {}, today: null, friends: [] };
  const r = mulberry32(11), ability = { memory: 1.6, focus: 2.4, numbers: 2, noticing: 3, logic: 2.2, words: 2.6 };
  const daysAgo = [14, 13, 11, 10, 9, 7, 6, 4, 3, 2, 1];
  const base = new Date(); base.setHours(18, 30, 0, 0);
  daysAgo.forEach((d, di) => {
    const third = ['focus', 'noticing', 'logic', 'words'][di % 4];
    [['memory', di % 2], ['numbers', (di + 1) % 2], [third, Math.floor(di / 4) % 2]].forEach(([s, gi], pi) => {
      const k = SKILL_GAMES[s][gi], g = GAMES[k], sk = p.skills[s], start = sk.level, changes = [], res = [], ab = ability[s] + di * 0.12;
      for (let t = 0; t < g.trials; t++) {
        const pr = Math.min(0.95, Math.max(0.2, 0.72 - 0.2 * (sk.level - ab)));
        const ok = r() < pr; res.push(ok);
        if (ok) { sk.streak++; if (sk.streak >= 2) { sk.streak = 0; if (sk.level < 10) { sk.level++; changes.push({ dir: 'up', to: sk.level }); } } }
        else { sk.streak = 0; if (sk.level > 1) { sk.level--; changes.push({ dir: 'down', to: sk.level }); } }
      }
      const opts = STRATS[k].opts;
      const strategy = r() < 0.25 + di * 0.06 ? opts[0][0] : (r() < 0.5 ? opts[2][0] : 'none');
      const avg = { lily: 21000, frogs: 900, odd: 3200, mirror: 9000, trail: 5200, picnic: 3800, berry: 6100, more: 2600, next: 4200, sort: 1500, cat: 9000, word: 8000 }[k];
      const dur = { lily: 80000, frogs: 75000, odd: 40000, mirror: 60000, trail: 65000, picnic: 55000, berry: 50000, more: 30000, next: 45000, sort: 70000, cat: 60000, word: 55000 }[k];
      const fun = k === 'mirror' ? (r() < 0.6 ? 1 : 0) : (r() < 0.65 ? 2 : r() < 0.8 ? 1 : 0);
      p.log.push({ ts: base.getTime() - d * 86400000 + pi * 150000, game: k, skill: s, trials: g.trials, correct: res.filter(Boolean).length, results: res, levelStart: start, levelEnd: sk.level, changes, avgMs: Math.round(avg * (0.8 + r() * 0.4)), durMs: Math.round(dur * (0.85 + r() * 0.3)), strategy, fun });
    });
  });
  daysAgo.forEach((d, i) => { const f = FRIENDS[i % FRIENDS.length]; p.friends.push({ name: f[0], hue: f[1], ts: base.getTime() - d * 86400000 + 600000 }); });
  p.quests = { [weekKey()]: { 'memory-0': true, 'numbers-1': true } };
  S.profiles[id] = p; S.activeId = id; S.copyText = null;
  S.screen = 'parent'; save(); render();
}

/* ---------- Events ---------- */
function setChipGroup(t, pressedFn) { t.parentElement.querySelectorAll('button[data-act]').forEach(c => c.setAttribute('aria-pressed', String(pressedFn(c)))); }
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, p = P();
  if (act === 'quest') return;
  switch (act) {
    case 'setup': case 'add-kid': S.draft = { name: '', band: '7-9', focus: ['memory', 'numbers'], minutes: 10 }; S.screen = 'setup'; render(); break;
    case 'playas': S.activeId = t.dataset.id; save(); S.screen = 'home'; render(); break;
    case 'switch': token++; S.screen = 'welcome'; render(); break;
    case 'demo': loadDemo(); break;
    case 'back': S.screen = 'welcome'; render(); break;
    case 'to-parent': S.screen = P() ? 'parent' : 'welcome'; render(); break;
    case 'band': S.draft.band = t.dataset.v; setChipGroup(t, c => c === t); break;
    case 'min': S.draft.minutes = +t.dataset.v; setChipGroup(t, c => c === t); break;
    case 'focus': { const v = t.dataset.v, f = S.draft.focus; if (f.includes(v)) f.splice(f.indexOf(v), 1); else { f.push(v); if (f.length > 2) f.shift(); } setChipGroup(t, c => f.includes(c.dataset.v)); break; }
    case 'gate': openGate(); break;
    case 'warm': {
      const w = p.today.warm; w.answer = w.opts[+t.dataset.i]; save(); render();
      speak(w.answer === w.correct ? 'Yes! You remembered the trick.' : `Close! It was: ${w.correct}`);
      break;
    }
    case 'play': play(t.dataset.key); break;
    case 'stop': token++; S.screen = 'home'; render(); break;
    case 'strat': {
      S.current.strategy = t.dataset.v; save();
      setChipGroup(t, c => c === t);
      const tip = STRATS[S.current.game].tip[t.dataset.v]; $('#tip').textContent = tip; speak(tip);
      break;
    }
    case 'next': if (p.today.plan.some(k => !p.today.done.includes(k))) { S.screen = 'home'; render(); } else goDone(); break;
    case 'finish': goDone(); break;
    case 'fun': S.current.fun = +t.dataset.v; save(); setChipGroup(t, c => c === t); if (+t.dataset.v === 2) sfx('ok'); break;
    case 'garden': S.gardenFrom = S.screen; S.screen = 'garden'; render(); break;
    case 'garden-back': S.screen = S.gardenFrom === 'done' ? 'done' : 'home'; render(); break;
    case 'set-sound': p.child.sounds = p.child.sounds === false; t.setAttribute('aria-pressed', String(p.child.sounds)); save(); if (p.child.sounds) sfx('ok'); break;
    case 'fb': { const k = t.dataset.k, v = ['enjoy', 'useful'].includes(k) ? +t.dataset.v : t.dataset.v; S.fb[k] = v; setChipGroup(t, c => c === t); const a = $('#fb-wa'); if (a) a.href = waLink(feedbackText(p)); break; }
    case 'fb-copy': {
      const text = feedbackText(p), status = $('#fb-status');
      const fallback = () => { S.fbCopy = text; render(); const fb = $('#feedback'); if (fb) fb.scrollIntoView(); const box = $('#fb-box'); if (box) { box.focus(); box.select(); } };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { if (status) status.textContent = 'Copied. Paste it to whoever shared Mindmint with you.'; }).catch(fallback); else fallback(); } catch (err) { fallback(); }
      break;
    }
    case 'calm': S.screen = 'calm'; render(); runCalm(); break;
    case 'calm-done': token++; S.screen = 'done'; render(); break;
    case 'child': S.screen = 'home'; render(); break;
    case 'view-kid': S.activeId = t.dataset.id; S.copyText = null; S.fbCopy = null; save(); render(); break;
    case 'set-focus': { const v = t.dataset.v, f = p.child.focus; if (f.includes(v)) f.splice(f.indexOf(v), 1); else { f.push(v); if (f.length > 2) f.shift(); } setChipGroup(t, c => f.includes(c.dataset.v)); save(); break; }
    case 'set-min': p.child.minutes = +t.dataset.v; setChipGroup(t, c => c === t); save(); break;
    case 'set-read': p.child.readAloud = !p.child.readAloud; t.setAttribute('aria-pressed', String(p.child.readAloud)); save(); if (p.child.readAloud) speak('Hi! I will read things out loud.'); break;
    case 'set-timer': p.child.noTimer = !p.child.noTimer; t.setAttribute('aria-pressed', String(p.child.noTimer)); save(); break;
    case 'copy-week': {
      const text = weekText(p), status = $('#copy-status');
      const fallback = () => { S.copyText = text; render(); const box = $('#copy-box'); if (box) { box.focus(); box.select(); } };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { if (status) status.textContent = 'Copied. Paste it into WhatsApp, email or a note.'; }).catch(fallback);
        else fallback();
      } catch (err) { fallback(); }
      break;
    }
    case 'clear-demo': case 'delete-yes': {
      token++; delete S.profiles[p.id];
      const next = profileList()[0]; S.activeId = next ? next.id : null; S.copyText = null;
      save(); S.screen = next ? 'parent' : 'welcome'; render(); break;
    }
    case 'delete': $('#del-row').innerHTML = `<span>Delete ${esc(p.child.name)}'s profile and every session?</span><button class="btn small" data-act="delete-yes">Yes, delete</button><button class="btn ghost small" data-act="delete-no">Keep</button>`; break;
    case 'delete-no': render(); break;
  }
});
app.addEventListener('change', e => {
  const t = e.target; if (t.dataset.act !== 'quest') return;
  const p = P(), wk = weekKey(); p.quests[wk] = p.quests[wk] || {}; p.quests[wk][t.dataset.k] = t.checked; save();

/* ---------- Start (keeps place across republishes) ---------- */
function start(data) {
  if (data && data.S && data.S.profiles) { S = Object.assign(blank(), data.S); Object.values(S.profiles).forEach(normalize); } else loadSaved();
  if (S.activeId && !S.profiles[S.activeId]) S.activeId = null;
  if (!P() && !['welcome', 'setup'].includes(S.screen)) S.screen = 'welcome';
  if (S.screen === 'setup' && !S.draft) S.screen = 'welcome';
  if (['game', 'calm'].includes(S.screen)) S.screen = P() ? 'home' : 'welcome';
  if (S.screen === 'result' && !S.current) S.screen = 'home';
  render();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  window.claude.hot.snapshot(() => ({ S: Object.assign(persist(), { screen: ['game', 'calm'].includes(S.screen) ? 'home' : S.screen, current: S.current, draft: S.draft }) }));
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
