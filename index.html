<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmint Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centred app column (phone to tablet). Child screens sit in a night garden lit by fireflies; the grown-up area is a clear paper report. */
  --night:#1b1938;
  --night-raised:#2a2754;
  --glow:#ffcf5c;
  --mint:#7fdcc0;
  --rose:#ff9a8f;
  --moon:#ece9ff;
  --moon-soft:#b9b5e6;
  --paper:#f3f1fa;
  --card:#ffffff;
  --ink:#1f1c3f;
  --ink-soft:#5b5884;
  --line:#dcd8ee;
  --violet:#5b43c9;
  --good:#1f7a5e;
  --warn:#9a5b06;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--moon);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.grownup{background:var(--paper);color:var(--ink);color-scheme:light}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
body.grownup #sky{display:none}
.fly{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px 3px rgba(255,207,92,.55);opacity:0;animation:drift 10s ease-in-out infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}20%{opacity:.85}50%{transform:translate(28px,-36px);opacity:.35}80%{opacity:.75}100%{transform:translate(-12px,-80px);opacity:0}}
.app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(2.1rem,6.5vw,3.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,4vw,1.8rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.eyebrow{font:700 .78rem/1.25 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--glow)}
body.grownup .eyebrow{color:var(--violet)}
.lede{font-size:1.15rem;color:var(--moon-soft);max-width:34em}
.soft{color:var(--moon-soft)}
body.grownup .soft{color:var(--ink-soft)}
.stack{display:flex;flex-direction:column;gap:16px}
.block{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font:800 1.35rem var(--font-display)}
.brand small{font:700 .7rem var(--font-body);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:999px;padding:2px 9px;opacity:.75}
.btn{appearance:none;border:0;border-radius:999px;background:var(--glow);color:var(--night);font:700 1.05rem var(--font-display);padding:12px 24px;min-height:48px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,207,92,.3)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn.small{min-height:40px;padding:8px 16px;font-size:.95rem}
.btn.big{font-size:1.25rem;padding:16px 32px;min-height:60px;align-self:center}
body.grownup .btn{background:var(--violet);color:#fff}
body.grownup .btn:hover{box-shadow:0 6px 20px rgba(91,67,201,.25)}
body.grownup .btn.ghost{background:transparent;color:var(--violet)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
body.grownup button:focus-visible,body.grownup input:focus-visible,body.grownup textarea:focus-visible,.gate button:focus-visible,.gate input:focus-visible{outline-color:var(--violet)}

/* Welcome */
.hero{display:grid;grid-template-columns:1fr 170px;gap:20px;align-items:center}
.hero-pip{display:flex;justify-content:center}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero-pip{order:-1;justify-content:flex-start}.hero-pip svg{width:92px;height:92px}}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.pillar{background:var(--night-raised);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.pillar h3{color:var(--glow)}
.pillar p{color:var(--moon-soft)}
.promise{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1.5px solid rgba(236,233,255,.32);border-radius:999px;padding:6px 14px;font-size:.92rem}
.preview{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.preview .eyebrow{color:var(--violet)}
.preview .soft{color:var(--ink-soft)}
.preview-row{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.preview-row .lv{font:800 2.4rem/1 var(--font-display);color:var(--violet);grid-row:span 2}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.who-btn{appearance:none;border:2px solid var(--glow);background:var(--night-raised);color:var(--moon);border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;font:700 1.2rem var(--font-display);text-align:left}
.who-btn small{display:block;font:400 .85rem var(--font-body);color:var(--moon-soft)}

/* Cards and forms */
.card{background:var(--night-raised);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
body.grownup .card{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(31,28,63,.05)}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .label{font-weight:700}
input[type=text]{width:100%;font:1.1rem var(--font-body);padding:12px 14px;border-radius:14px;border:2px solid rgba(236,233,255,.25);background:var(--night);color:var(--moon)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:2px solid rgba(236,233,255,.3);background:transparent;color:inherit;border-radius:999px;padding:9px 16px;font:700 1rem var(--font-body);cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--night)}
body.grownup .chip{border-color:var(--line)}
body.grownup .chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.err{color:var(--rose);min-height:1.3em;font-size:.95rem}

/* Pip */
.pip-say{display:flex;align-items:center;gap:14px}
.bubble{background:var(--moon);color:var(--night);border-radius:20px 20px 20px 6px;padding:12px 16px;font:600 1.15rem/1.35 var(--font-display);flex:1;max-width:32em;min-height:3em;display:flex;align-items:center}
.compact .bubble{font-size:1.02rem;min-height:2.6em}
.pip{flex:none;overflow:visible}
.pip.glowing{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* Child home */
ol.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{display:flex;align-items:center;gap:14px;background:var(--night-raised);border-radius:18px;padding:12px 16px;border:2px solid transparent}
.stop.next{border-color:var(--glow)}
.stop-name{display:block;font:700 1.15rem var(--font-display)}
.stop-sub{display:block;color:var(--moon-soft);font-size:.95rem}
.lantern{color:#8d89c4;flex:none}
.lantern .body{fill:var(--night);stroke:#8d89c4;stroke-width:2}
.lantern.on{color:var(--glow)}
.lantern.on .body{fill:var(--glow);stroke:var(--glow);filter:drop-shadow(0 0 8px rgba(255,207,92,.8))}
.warm{border:2px dashed rgba(255,207,92,.6)}

/* Game */
.trialbar{display:flex;gap:8px;justify-content:center}
.tdot{width:14px;height:14px;border-radius:50%;background:rgba(236,233,255,.2)}
.tdot.ok{background:var(--mint)}
.tdot.no{background:var(--rose)}
.tdot.cur{box-shadow:0 0 0 3px var(--glow)}
.board{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:320px}
.grid{display:grid;gap:10px;width:min(88vw,460px)}
.cell{aspect-ratio:1;border:0;border-radius:20px;background:var(--night-raised);cursor:pointer;font:800 1.6rem var(--font-display);color:var(--night);transition:background .15s,box-shadow .15s}
.cell:disabled{cursor:default}
.cell.lit{background:var(--glow);box-shadow:0 0 28px 6px rgba(255,207,92,.5)}
.cell.tap{background:var(--mint)}
.cell.miss{background:var(--rose)}
.pad{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4f8f7c,#2b5f53);color:#f2fff9;font:800 clamp(1.1rem,4.5vw,1.6rem) var(--font-display);cursor:pointer}
.pad.found{background:rgba(127,220,192,.14);color:rgba(242,255,249,.35);cursor:default}
.pad.hint{box-shadow:0 0 0 4px var(--glow),0 0 24px var(--glow)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.timer{font-weight:700;font-variant-numeric:tabular-nums;color:var(--moon-soft)}
.timer.over{color:var(--rose)}
.target{display:flex;align-items:baseline;gap:10px}
.t-label{font:700 1.3rem var(--font-display);color:var(--moon-soft)}
.t-num{font:800 3.8rem/1 var(--font-display);color:var(--glow)}
.sum{font:700 1.3rem var(--font-display);font-variant-numeric:tabular-nums;min-height:1.6em;text-align:center}
.sum.good{color:var(--mint)}
.sum.bad{color:var(--rose)}
.berries{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:460px}
.berry{width:76px;height:76px;border-radius:50% 50% 46% 46%;border:0;background:radial-gradient(circle at 35% 30%,#ff9db5,#c2456a);color:#fff;font:800 1.7rem var(--font-display);cursor:pointer;transition:transform .15s,box-shadow .15s;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.berry[aria-pressed="true"]{transform:translateY(-6px);box-shadow:0 0 0 4px var(--glow)}
.berry.answer{box-shadow:0 0 0 4px var(--mint),0 0 20px var(--mint)}
.berry:disabled{cursor:default}
.lantern-btn{aspect-ratio:1;border:0;border-radius:50%;background:var(--l);box-shadow:0 0 18px -2px var(--l);cursor:pointer}
.lantern-btn:disabled{cursor:default}
.lantern-btn.found{outline:4px solid var(--mint);outline-offset:3px}
.lantern-btn.miss{outline:4px solid var(--rose);outline-offset:3px}
.lantern-btn.reveal{outline:4px dashed var(--glow);outline-offset:4px}
.timebar{width:min(88vw,460px);height:8px;border-radius:99px;background:rgba(236,233,255,.15);overflow:hidden}
.timebar span{display:block;height:100%;width:100%;background:var(--glow)}
.levelnote{text-align:center;color:var(--moon-soft);font-size:.95rem}
/* Picnic */
.basket{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:520px;padding:18px;border-radius:24px;background:repeating-linear-gradient(45deg,rgba(255,154,143,.16) 0 14px,rgba(255,154,143,.07) 14px 28px)}
.item{display:flex;flex-direction:column;align-items:center;font-size:2.6rem;line-height:1.1;width:78px}
.item small{font:700 .8rem var(--font-body);color:var(--moon-soft)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:12px;width:min(88vw,420px)}
.choice{appearance:none;border:2px solid rgba(236,233,255,.3);background:var(--night-raised);color:var(--moon);border-radius:18px;padding:10px;font-size:2.2rem;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.choice small{font:700 .85rem var(--font-body);color:var(--moon-soft)}
.choice.right{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint)}
.choice.wrong{border-color:var(--rose)}
.q{font:700 1.3rem var(--font-display)}
/* Frogs */
.pond{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(88vw,420px)}
.spot{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#2f5d55,#22403f);display:grid;place-items:center;transition:box-shadow .15s}
.spot.okflash{box-shadow:0 0 0 4px var(--mint)}
.spot.badflash{box-shadow:0 0 0 4px var(--rose)}
.frog{width:74%;aspect-ratio:1;border:0;border-radius:50% 50% 44% 44%;cursor:pointer;font:800 1.6rem var(--font-display);color:#fff;display:grid;place-items:center}
.frog.go{background:radial-gradient(circle at 35% 30%,#b9f5c9,#2f9e5a);box-shadow:0 0 22px rgba(127,220,150,.6)}
.frog.stop{background:radial-gradient(circle at 35% 30%,#ffc2bb,#c9392f);border-radius:22%}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;color:var(--moon-soft)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:18px;border-radius:50%}
.legend i.g{background:#2f9e5a}
.legend i.r{background:#c9392f;border-radius:4px}
/* Which has more */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(88vw,480px)}
.side{appearance:none;border:2px solid rgba(236,233,255,.25);background:var(--night-raised);color:var(--moon);border-radius:22px;min-height:150px;padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:800 clamp(1.6rem,6vw,2.4rem) var(--font-display);font-variant-numeric:tabular-nums}
.side.right{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint)}
.side.wrong{border-color:var(--rose)}
.side small{font:700 .95rem var(--font-body);color:var(--moon-soft)}
.dotset{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:150px}
.dotset i{width:20px;height:20px;border-radius:50%;background:var(--glow)}
/* Mirror */
.mgrid{display:grid;gap:6px}
.mcell{aspect-ratio:1;border:0;border-radius:10px;background:var(--night-raised);cursor:pointer;position:relative}
.mcell.left{cursor:default;background:rgba(42,39,84,.6)}
.mcell.on{background:var(--glow);box-shadow:0 0 14px rgba(255,207,92,.6)}
.mcell.edge{box-shadow:6px 0 0 -2px var(--mint)}
.mcell.on.edge{box-shadow:6px 0 0 -2px var(--mint),0 0 14px rgba(255,207,92,.6)}
.mcell.should{outline:3px dashed var(--mint);outline-offset:-3px}
.mcell.wrongon{background:var(--rose)}

/* Result and done */
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font:800 3.4rem/1 var(--font-display);color:var(--glow)}
.lvl{font-weight:700}
.lantern-row{display:flex;justify-content:center;gap:18px}
.quest h2{font-size:1.5rem}
/* Calm corner */
.calm{display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px 0}
.breath{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fff6c9 0%,var(--glow) 45%,rgba(255,207,92,0) 72%);transform:scale(.6);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.25)}
.breath.out{transform:scale(.6)}
.calm-text{font:700 1.6rem var(--font-display);text-align:center;min-height:2.2em}

/* Parental gate */
.overlay{position:fixed;inset:0;background:rgba(10,9,28,.72);display:grid;place-items:center;padding:16px;z-index:10}
.gate{background:var(--paper);color:var(--ink);border-radius:22px;padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.gate input[type=text]{background:#fff;color:var(--ink);border:2px solid var(--line)}
.gate .btn{background:var(--violet);color:#fff}
.gate .btn.ghost{background:transparent;color:var(--violet)}
.gate .err{color:#b3261e}

/* Grown-up area */
.banner{background:#fff4d6;color:#5a4200;border:1px solid #f0d58a;border-radius:14px;padding:10px 14px;font-size:.95rem}
.linkbtn{appearance:none;background:none;border:0;color:var(--violet);font:700 .95rem var(--font-body);text-decoration:underline;cursor:pointer;padding:0 4px}
.kids{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.stats div{display:flex;flex-direction:column;border-top:3px solid var(--violet);padding-top:8px}
.stats b{font:800 1.6rem var(--font-display);font-variant-numeric:tabular-nums}
.stats span{color:var(--ink-soft);font-size:.9rem}
.note{border-left:6px solid var(--glow) !important}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.skill,.lifecard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.skill header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{font:700 .8rem var(--font-body);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.up{background:#dff5ec;color:var(--good)}
.pill.down{background:#fff0d9;color:var(--warn)}
.pill.steady,.pill.new{background:#ecebf6;color:var(--ink-soft)}
.level{display:flex;align-items:baseline;gap:8px}
.level .lv{font:800 2.6rem/1 var(--font-display);color:var(--violet)}
.level .of{color:var(--ink-soft);font-size:.9rem}
.means{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.means li{font-weight:700}
.means li span{display:block;font-weight:400;color:var(--ink-soft);font-size:.85rem}
.spark{margin:0}
.spark svg{width:100%;height:auto;display:block}
.spark .g{stroke:var(--line);stroke-dasharray:3 3}
.spark .a{fill:var(--violet);opacity:.12}
.spark .l{fill:none;stroke:var(--violet);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark .d{fill:var(--violet)}
.spark .t{fill:var(--ink-soft);font:11px var(--font-body)}
.spark figcaption{font-size:.8rem;color:var(--ink-soft)}
dl{margin:0;display:flex;flex-direction:column;gap:8px}
dl div{display:grid;grid-template-columns:118px 1fr;gap:10px}
dt{color:var(--ink-soft);font-size:.9rem}
dd{margin:0;font-size:.95rem}
@media (max-width:420px){dl div{grid-template-columns:1fr;gap:0}}
.rules ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.life{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.lifecard h3{font-size:1.1rem;line-height:1.25}
.act{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0;padding-top:0}
.check{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--good);cursor:pointer;align-self:flex-start;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--good)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
tr:last-child td{border-bottom:0}
.up-t{color:var(--good);font-weight:700}
.down-t{color:var(--warn);font-weight:700}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.weekgrid div{background:var(--paper);border-radius:14px;padding:10px 12px}
.weekgrid b{display:block;font-family:var(--font-display);font-size:1.1rem}
textarea{width:100%;min-height:180px;font:.95rem/1.4 var(--font-body);border:2px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);background:#fff}
.setrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}

/* v3: new games, rewards, feedback */
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.burst{position:fixed;left:50%;top:42%;width:0;height:0;z-index:20;pointer-events:none}
.burst i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--glow);box-shadow:0 0 14px var(--glow);transform:rotate(var(--a)) translateY(0);animation:burst 1.1s ease-out var(--d) forwards}
@keyframes burst{to{transform:rotate(var(--a)) translateY(-150px) scale(.3);opacity:0}}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:560px}
.seq-item{width:56px;height:56px;border-radius:14px;background:var(--night-raised);display:grid;place-items:center}
.seq-item.ask{border:2px dashed var(--glow);font:800 1.6rem var(--font-display);color:var(--glow)}

.word-pic{font-size:4.2rem;line-height:1}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;background:radial-gradient(ellipse at 50% 120%,rgba(127,220,192,.18),transparent 70%);border-radius:24px;padding:16px}

@media (max-width:370px){.topbar{gap:6px}.topbar .brand{font-size:1rem;gap:4px}.icon-row{gap:4px}.icon-row .icon-btn{min-width:40px;height:40px;padding:0 5px;font-size:1.05rem}}
.icon-btn{appearance:none;border:2px solid rgba(236,233,255,.3);background:transparent;color:inherit;border-radius:999px;min-width:48px;height:48px;padding:0 12px;font-size:1.3rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.lib-open{align-self:center;min-height:52px;font-size:1.1rem}

.lib-badge{position:absolute;top:-9px;right:-4px;background:var(--c);color:#1f1c3f;font:800 .7rem var(--font-display);padding:2px 7px;border-radius:999px;letter-spacing:.04em}
.lib-badge.today{background:var(--glow)}
@media (max-width:360px){.lib-title{font-size:.85rem}.lib-ico{font-size:2.2rem}}
.stop-state{font-size:1.5rem}
.btn.play{font-size:1.5rem;min-width:220px;min-height:68px}
.intro{display:flex;flex-direction:column;align-items:center;gap:22px;padding:10px 0}
.intro-ico{font-size:5rem;line-height:1}
.howto{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--night-raised);border-radius:18px;padding:12px 14px;min-width:110px;font:700 1rem var(--font-display);text-align:center}
.step-ico{font-size:2.4rem;line-height:1}
.arrow{font:800 1.6rem var(--font-display);color:var(--glow)}

.result-hero{align-items:center;text-align:center}
.stars{display:flex;gap:6px;font-size:3rem;line-height:1}

.stars span.on{color:var(--glow);text-shadow:0 0 14px rgba(255,207,92,.7)}
.lvl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.lvl-badge{font:800 1.1rem var(--font-display);padding:4px 12px;border-radius:999px;background:rgba(236,233,255,.1)}
.lvl-badge.up{background:var(--mint);color:var(--night)}
.pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick-col{display:flex;flex-direction:column;gap:8px}
.pick{appearance:none;border:2px solid rgba(236,233,255,.25);background:var(--night);color:var(--moon);border-radius:18px;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:700 .95rem var(--font-body);text-align:center}
.pick.wide{flex-direction:row;justify-content:center}
.pick-ico{font-size:2rem;line-height:1}
.pick[aria-pressed="true"]{border-color:var(--mint);background:rgba(127,220,192,.16)}
.big-feedback{font:800 1.3rem var(--font-display)}
.faces{display:flex;gap:10px;flex-wrap:wrap}
.face{appearance:none;border:3px solid transparent;background:rgba(236,233,255,.08);border-radius:20px;width:76px;height:76px;font-size:2.6rem;cursor:pointer;line-height:1}
.face.sm{width:56px;height:56px;font-size:1.8rem;border-radius:16px}
.face[aria-pressed="true"]{border-color:var(--glow);background:rgba(255,207,92,.18);transform:scale(1.06)}

body.grownup .face[aria-pressed="true"]{border-color:var(--violet);background:#e6e0ff}
.quest-row{display:flex;align-items:center;gap:14px}
.quest-ico{font-size:3rem;line-height:1;flex:none}
.pillar{flex-direction:row;align-items:center;gap:12px}
.pillar-ico{font-size:2rem;line-height:1}
.pillar h3{color:var(--moon)}
.say{font-weight:700;font-size:1.05rem}
.skrow-static,.skrow summary{display:grid;grid-template-columns:40px minmax(70px,auto) 1fr 28px 40px;align-items:center;gap:10px}
.sk-badge{width:38px;height:38px;border-radius:12px;background:var(--c);color:#1f1c3f;display:grid;place-items:center}
.sk-name{font:700 1rem var(--font-display)}
.bar{height:14px;border-radius:999px;background:#e8e5f3;overflow:hidden;display:block}
.bar span{display:block;height:100%;border-radius:999px}
.preview .bar{background:#e8e5f3}
.lv-num{font:800 1.2rem var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.chg{font:800 .95rem var(--font-body);text-align:center;color:var(--ink-soft)}
.chg.up{color:var(--good)}
.chg.down{color:var(--warn)}
.skrows{display:flex;flex-direction:column;gap:4px}
.skrow{border-radius:14px;padding:6px 6px}
.skrow[open]{background:var(--paper)}
.skrow summary{cursor:pointer;list-style:none;padding:4px 0}
.skrow summary::-webkit-details-marker{display:none}
.sk-detail{padding:10px 4px 6px 50px;display:flex;flex-direction:column;gap:10px}
.means li{font-weight:600}
.hint{font-size:.88rem}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-card h1{font-size:clamp(1.8rem,5vw,2.4rem)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 .8rem var(--font-body);color:var(--ink-soft)}
.day i{width:30px;height:30px;border-radius:50%;background:#e8e5f3;display:block}
.day.on i{background:var(--violet);box-shadow:0 0 0 3px rgba(91,67,201,.18)}
.day.today i{outline:2px dashed var(--violet);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tiles div{background:var(--paper);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center}
.tiles b{font:800 1.45rem var(--font-display);font-variant-numeric:tabular-nums}
.tiles span{font-size:.82rem;color:var(--ink-soft)}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}.skrow-static,.skrow summary{grid-template-columns:38px 1fr 26px 36px}.skrow-static .bar,.skrow summary .bar{grid-column:2/3;grid-row:2}.sk-detail{padding-left:4px}}
.note h2{font-size:1.35rem}
.why summary,.lifetile summary{cursor:pointer;color:var(--violet);font-weight:700;font-size:.9rem}
.favs{display:flex;flex-wrap:wrap;gap:10px}
.fav{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700}
.fav b{font-size:1.6rem;line-height:1}
.lifegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lifetile{background:var(--paper);border:2px solid transparent;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px}
.lifetile.done{border-color:var(--good);background:#e4f6ee}
.tile-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;cursor:pointer}
.tile-ico{font-size:1.8rem;line-height:1}
.tile-name{font:700 .95rem var(--font-display);line-height:1.15}
.tile-top input{width:22px;height:22px;accent-color:var(--good)}
.lifetile details p{font-size:.88rem;margin-top:4px}
.fold summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";font:800 1.4rem var(--font-display);color:var(--violet)}
.fold[open] summary::after{content:"–"}
.fold-body{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rules-pic{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:800 1.2rem var(--font-display)}
.rules-pic .rp{background:var(--paper);border-radius:10px;padding:4px 10px}
.rules-pic .chg{font-size:1.05rem;margin-right:14px}
body.grownup .chip[data-act="add-kid"]{border-style:dashed}
body.grownup .arrow{color:var(--violet)}
/* v5: demos, voice, card */
.hear{flex:none;width:48px;padding:0;justify-content:center}
.demo{position:relative;width:min(84vw,320px);min-height:190px;background:rgba(236,233,255,.06);border:2px dashed rgba(236,233,255,.18);border-radius:22px;padding:18px;display:grid;place-items:center;overflow:hidden}
.demo-scene{display:flex;flex-direction:column;align-items:center;gap:12px}
.dgrid{display:grid;gap:7px}
.dgrid.g3{grid-template-columns:repeat(3,38px)}
.dgrid.g2{grid-template-columns:repeat(2,52px)}
.dgrid.g4{grid-template-columns:repeat(4,32px)}
.dc{width:100%;aspect-ratio:1;border-radius:10px;background:var(--night-raised);display:block;transition:background .2s}
.dc.lit,.dc.on{background:var(--glow);box-shadow:0 0 14px rgba(255,207,92,.7)}
.dc.hit{background:var(--mint);box-shadow:0 0 14px rgba(127,220,192,.6)}
.dc.edge{box-shadow:5px 0 0 -2px var(--mint)}
.dc.on.edge{box-shadow:5px 0 0 -2px var(--mint),0 0 14px rgba(255,207,92,.7)}
.drow{display:flex;gap:10px;align-items:center;justify-content:center;font-size:1.8rem;line-height:1}
.ditem,.dopt{font-size:2rem;padding:6px;border-radius:14px;transition:all .3s;border:3px solid transparent}
.ditem.big{font-size:3rem}
.dopt{background:var(--night-raised)}
.hit.ditem,.hit.dopt,.hit.dbin,.hit.dside,.hit.dlan,.hit.dbtn{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint)}
.gone{opacity:0;transform:scale(.5);transition:all .35s}
.dpad{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4f8f7c,#2b5f53);color:#fff;display:grid;place-items:center;font:800 1.3rem var(--font-display);transition:opacity .2s}
.dpad.hit{opacity:.3}
.dspot{position:relative;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#2f5d55,#22403f)}

.dfrog.go{background:radial-gradient(circle at 35% 30%,#b9f5c9,#2f9e5a)}
.dfrog.stop{background:radial-gradient(circle at 35% 30%,#ffc2bb,#c9392f);border-radius:22%}
.dfrog.hit{box-shadow:0 0 0 4px var(--mint)}
.dtarget{font:800 1.6rem var(--font-display);color:var(--glow)}
.dberry{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9db5,#c2456a);color:#fff;display:grid;place-items:center;font:800 1.4rem var(--font-display);transition:transform .2s}
.dberry.hit{transform:translateY(-6px);box-shadow:0 0 0 4px var(--glow)}
.dsum{font:800 1.3rem var(--font-display);color:var(--mint);min-height:1.4em}
.dside{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:96px;min-height:70px;padding:10px;border-radius:16px;background:var(--night-raised);border:3px solid transparent;align-content:center}
.dside i{width:14px;height:14px;border-radius:50%;background:var(--glow)}
.dlan{width:52px;height:52px;border-radius:50%;background:hsl(200 78% 56%);border:3px solid transparent;box-shadow:0 0 14px -2px hsl(200 78% 56%)}
.dlan.odd{background:hsl(200 78% 74%)}
.dbtn{font-size:1.6rem;border:3px solid transparent;border-radius:12px;padding:2px 6px}
.dq{border:2px dashed var(--glow);border-radius:10px;padding:2px 8px;color:var(--glow);font:800 1.4rem var(--font-display)}
.drule{font-size:2.2rem}
.dcardmini{width:62px;height:62px;border-radius:14px;background:var(--moon);display:grid;place-items:center}
.dbin{width:64px;height:64px;border-radius:16px;background:var(--night-raised);display:grid;place-items:center;border:3px solid transparent}
.dslot{width:34px;height:40px;border-bottom:3px solid var(--moon-soft);display:grid;place-items:center;font:800 1.5rem var(--font-display);color:var(--glow);text-transform:uppercase}
.dtile{width:40px;height:40px;border-radius:10px;background:var(--moon);color:var(--night);display:grid;place-items:center;font:800 1.4rem var(--font-display);text-transform:uppercase;transition:opacity .2s}
.dtile.hit{opacity:.25}
.finger{position:absolute;left:50%;top:120%;font-size:2.2rem;line-height:1;opacity:0;transition:left .45s ease,top .45s ease,opacity .25s,transform .15s;pointer-events:none;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.finger.show{opacity:1}
.finger.press{transform:scale(.8) translateY(4px)}
.demo-ok{position:absolute;right:12px;top:10px;width:40px;height:40px;border-radius:50%;background:var(--mint);color:var(--night);display:grid;place-items:center;font:800 1.5rem var(--font-display);opacity:0;transform:scale(.5);transition:all .3s}
.demo-ok.show{opacity:1;transform:scale(1)}
.pcard{width:100%;max-width:420px;border-radius:18px;box-shadow:0 10px 30px rgba(31,28,63,.25);align-self:center}
/* v6: polished parent rows, history bars, activity tiles */
.legend-line{display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:.88rem}
.skrows{gap:10px}
.skrow{border:1px solid var(--line);border-radius:18px;padding:0;background:#fff;transition:box-shadow .2s,border-color .2s}
.skrow:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line));box-shadow:0 6px 18px rgba(31,28,63,.06)}

.segbar.mini i{height:8px;border-radius:2px}
.segbar.mini i.on{background:var(--violet)}
.chev{width:12px;height:12px;border-right:2.5px solid var(--ink-soft);border-bottom:2.5px solid var(--ink-soft);transform:rotate(45deg);transition:transform .2s;flex:none;margin:0 4px 4px}
.skrow[open] .chev{transform:rotate(225deg);margin-top:6px}
.sk-detail{padding:2px 16px 18px 76px;gap:16px}
.gamecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.gamecard{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:12px}
.gc-ico{font-size:1.6rem;line-height:1;width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}
.gc-name{font:600 .78rem var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.gc-what{font-weight:600;line-height:1.35}
.hist{margin:0;display:flex;flex-direction:column;gap:6px}
.hist-plot{display:grid;grid-template-columns:22px 1fr;gap:8px;height:110px}
.hist-y{display:flex;flex-direction:column;justify-content:space-between;font:500 .72rem var(--font-body);color:var(--ink-soft);text-align:right;padding:0 0 0}
.hist-bars{display:flex;align-items:flex-end;gap:5px;border-bottom:2px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent calc(50% - 1px),var(--line) calc(50% - 1px),var(--line) 50%)}
.hb{flex:1;max-width:34px;min-height:6px;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--c) 40%,#fff);position:relative}
.hb.last{background:var(--c)}
.hb b{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font:700 .8rem var(--font-body);color:var(--ink)}
.hist figcaption{font-size:.78rem;color:var(--ink-soft);padding-left:30px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fact{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fact-ico{font-size:1.3rem;line-height:1.2}
.fact-k{display:block;font:600 .72rem var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.fact-v{display:block;font-size:.92rem;line-height:1.35}
@media (max-width:560px){.sk-detail{padding:2px 12px 16px 12px}.skrow summary{padding:12px}}
.tried-meter{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:.88rem;color:var(--ink-soft)}
.tried-meter b{color:var(--ink);font-size:1rem}
.minibar{width:160px;height:8px;border-radius:999px;background:#ebe8f4;overflow:hidden;display:block}
.minibar span{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .3s}
.lifegrid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
@media (max-width:560px){.lifegrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.lifetile{padding:10px;gap:8px}.lifetile .tile-ico{width:40px;height:40px;font-size:1.4rem}.lt-skill{font-size:0;padding:4px}.lt-skill svg{width:14px;height:14px}.lifetile .tile-name{font-size:.95rem}.tried span{padding:5px 10px;font-size:.78rem}.lt-how summary{font-size:.76rem}.tried-meter{align-items:flex-start}}
.lifetile{background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:18px;padding:14px;gap:10px;transition:box-shadow .2s,border-color .2s}
.lifetile:hover{box-shadow:0 6px 18px rgba(31,28,63,.07)}
.lifetile.done{background:#f2fbf7;border-color:#bfe8d6;border-top-color:var(--good)}
.lt-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lifetile .tile-ico{font-size:1.7rem;width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,#fff);display:grid;place-items:center}
.lt-skill{display:inline-flex;align-items:center;gap:4px;font:600 .72rem var(--font-body);color:color-mix(in srgb,var(--c) 65%,#1f1c3f);background:color-mix(in srgb,var(--c) 14%,#fff);padding:3px 8px;border-radius:999px}
.lifetile .tile-name{font:700 1.05rem/1.2 var(--font-display);margin:0;min-height:2.4em}
.lt-foot{display:flex}
.tried{position:relative;cursor:pointer}
.tried input{position:absolute;opacity:0;width:1px;height:1px}
.tried span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font:600 .85rem var(--font-body);color:var(--ink-soft);background:#fff;transition:all .2s}
.tried input:checked + span{background:var(--good);border-color:var(--good);color:#fff}
.tried input:focus-visible + span{outline:3px solid var(--violet);outline-offset:2px}
.lt-how summary{list-style:none;font:600 .82rem var(--font-body);color:var(--violet);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.lt-how summary::-webkit-details-marker{display:none}
.lt-how summary::before{content:"i";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font:700 .7rem var(--font-body)}
.lt-how[open] summary{margin-bottom:6px}
.lt-how p{font-size:.86rem;line-height:1.4;color:var(--ink)}
/* v7: new games */
.pairs{gap:8px}
.pc{aspect-ratio:1;border:0;border-radius:16px;background:linear-gradient(145deg,#3b3780,#2a2754);cursor:pointer;position:relative;font-size:2rem;box-shadow:inset 0 0 0 2px rgba(255,207,92,.25)}
.pc .back{color:var(--glow);font-size:1.4rem}
.pc .front{display:none}
.pc.up{background:var(--moon)}
.pc.up .back{display:none}
.pc.up .front{display:inline}
.pc.matched{background:rgba(127,220,192,.25);box-shadow:inset 0 0 0 3px var(--mint)}
.arena{position:relative;width:min(88vw,440px);height:300px;border-radius:24px;background:radial-gradient(ellipse at 50% 110%,rgba(127,220,192,.12),transparent 60%),var(--night-raised);overflow:hidden}
.fly-btn{position:absolute;left:0;top:0;width:44px;height:44px;border:0;border-radius:50%;background:radial-gradient(circle,#d8d4ff 0%,#8d89c4 60%,rgba(141,137,196,0) 72%);cursor:pointer;will-change:transform}
.fly-btn.gold{background:radial-gradient(circle,#fff6c9 0%,var(--glow) 55%,rgba(255,207,92,0) 72%);box-shadow:0 0 18px rgba(255,207,92,.7)}
.fly-btn.picked{outline:3px solid var(--mint);outline-offset:-2px}
.fly-btn.wrong{outline:3px solid var(--rose);outline-offset:-2px}
.flashbox{position:relative;width:min(88vw,420px);aspect-ratio:3/2;border-radius:22px;background:var(--night-raised);transition:opacity .2s}
.flashbox i{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px rgba(255,207,92,.6)}
.flashbox.hidden i{opacity:0}
.num-opt{font:800 1.8rem var(--font-display)}
.shadow-src{font-size:4.5rem;line-height:1}
.opt.sil{background:var(--moon)}
.opt.sil span{display:inline-block;font-size:2.3rem;filter:brightness(0);opacity:.85;transition:filter .3s}
.opt.sil.reveal span{filter:none;opacity:1}
.pgrid{display:grid;gap:5px}
.pcell{aspect-ratio:1;border-radius:12px;background:var(--night-raised);display:grid;place-items:center;font-size:1.6rem;position:relative}
.pcell.wall{background:rgba(127,220,192,.12)}
.pcell.goal{box-shadow:inset 0 0 0 2px rgba(255,157,181,.6)}
.pcell.trail{background:rgba(255,207,92,.25)}
.pcell.sol{background:rgba(127,220,192,.35)}
.pcell.bump{background:rgba(255,154,143,.5)}
.pip-tok{position:absolute;inset:0;display:grid;place-items:center}
.seq-chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:36px;font-size:1.4rem;align-items:center}
.arrows{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.arrow-btn{width:60px;height:60px;border-radius:18px;border:2px solid rgba(236,233,255,.3);background:var(--night-raised);font-size:1.8rem;cursor:pointer}
.arrow-btn.undo{color:var(--moon);font-size:1.4rem}
.letter-tile{font:800 3.2rem/1 var(--font-display);color:var(--night);background:var(--glow);border-radius:20px;padding:10px 22px;letter-spacing:.04em}
.catitem.big{font-size:2.6rem}
.dcard{width:52px;height:52px;border-radius:12px;background:#3b3780;color:var(--glow);display:grid;place-items:center;font-size:1.6rem;border:3px solid transparent;transition:all .2s}
.dcard.hit{background:var(--moon);border-color:var(--mint)}
.dfly{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#d8d4ff 0%,#8d89c4 60%,rgba(141,137,196,0) 72%);border:3px solid transparent}
.dfly.lit{background:radial-gradient(circle,#fff6c9 0%,#ffcf5c 55%,rgba(255,207,92,0) 72%)}
.dfly.hit{border-color:var(--mint)}
.dbox{display:flex;gap:8px;padding:12px;border-radius:14px;background:var(--night-raised);transition:all .35s}
.dbox i{width:16px;height:16px;border-radius:50%;background:var(--glow)}
.dopt.sil{background:var(--moon)}
.dopt.sil b{filter:brightness(0);font-weight:400}
.dopt.sil.hit b{filter:none}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.fly{display:none}}
/* v9 parent dashboard */
body.grownup{--page:#f5f6fa;--surface:#fff;--surface-soft:#f7f7fb;--pink:#22243a;--muted:#6f7289;--pline:#e9eaf1;--accent:#6557d9;--accent-dark:#4e42bf;--accent-soft:#f0efff;--pshadow:0 12px 34px rgba(35,37,71,.055);--r:20px;--r-sm:14px;--pfont:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--page)}
body.grownup[data-skin="bright"]{--page:#fff9f0;--surface:#fffefa;--surface-soft:#fff4e5;--pink:#352f3b;--muted:#7a6e7d;--pline:#f2e6da;--accent:#ea765a;--accent-dark:#c25440;--accent-soft:#ffede5;--pshadow:0 12px 32px rgba(119,76,51,.08);--r:24px;--r-sm:16px;--pfont:"Trebuchet MS",Inter,ui-sans-serif,system-ui,sans-serif}
body.grownup .app{max-width:none;padding:0;gap:0}
.pd{color:var(--pink);font-family:var(--pfont);font-size:15px;line-height:1.45;transition:color .25s}
.pd h1,.pd h2,.pd h3{font-family:var(--pfont)}
.pd :where(button){font:inherit;color:inherit}
.pd button:focus-visible,.pd a:focus-visible,.pd summary:focus-visible,.pd textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pd-muted{color:var(--muted);font-size:.87rem}
.pd-muted.small{font-size:.8rem;display:block;margin-top:8px}
.pd-eyebrow{display:block;color:var(--muted);text-transform:uppercase;font-size:.7rem;font-weight:800;letter-spacing:.12em}
.pd-top{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--pline);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px)}
.pd-top-in{width:min(1180px,calc(100% - 48px));margin:auto;min-height:68px;display:flex;align-items:center;gap:30px}
.pd-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.5px;white-space:nowrap}
.pd-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:#fff;background:var(--accent);font-size:17px;box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 25%,transparent)}
.pd-tag{padding:4px 8px;border-radius:999px;border:1px solid var(--pline);color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.07em}
.pd-nav{display:flex;gap:6px}
.pd-nav button{border:0;background:none;color:var(--muted);font-size:14px;font-weight:650;padding:8px 10px;border-radius:10px;cursor:pointer}
.pd-nav button:hover{color:var(--pink);background:var(--surface-soft)}
.pd-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.pd-skin{display:flex;padding:3px;border:1px solid var(--pline);border-radius:999px;background:var(--surface)}
.pd-skin button{border:0;padding:7px 11px;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700}
.pd-skin button[aria-pressed="true"]{color:var(--accent-dark);background:var(--accent-soft)}
.pd-kids{display:flex;gap:6px}
.pd-avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2px solid transparent;background:var(--accent-soft);color:var(--accent-dark);font-weight:800;cursor:pointer;padding:0}
.pd-avatar[aria-pressed="true"]{border-color:var(--accent)}
.pd-avatar.add{background:transparent;border:1.5px dashed var(--pline);color:var(--muted)}
.pd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--pline);border-radius:999px;padding:9px 14px;background:var(--surface);color:var(--pink);font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:38px}
.pd-btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--pline))}
.pd-btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.pd-btn.primary:hover{background:var(--accent-dark)}
.pd-btn:disabled{opacity:.6}
.pd-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.pd-link{border:0;padding:0;background:none;color:var(--accent-dark);font-size:13px;font-weight:750;cursor:pointer;white-space:nowrap}
.pd-main{width:min(1180px,calc(100% - 48px));margin:30px auto 64px}
.pd-banner{margin-bottom:18px;padding:11px 16px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent-dark);font-size:13px;font-weight:600}
.pd-welcome{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}
.pd-welcome h1{margin:4px 0 5px;font-size:clamp(26px,3.4vw,36px);line-height:1.12;letter-spacing:-1.1px;font-weight:800}
.pd-welcome .pd-muted{font-size:15px}
.pd-date{color:var(--muted);font-size:13px;font-weight:650;white-space:nowrap}
.pd-layout{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(300px,.9fr);gap:22px;align-items:start}
.pd-col{display:grid;gap:18px;min-width:0}
.pd-card{border:1px solid var(--pline);border-radius:var(--r);background:var(--surface);box-shadow:var(--pshadow);padding:20px 22px}
.pd-card h2,.pd-sec-head h2{margin:0;font-size:18px;letter-spacing:-.35px;font-weight:750}
.pd-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
/* week */
.pd-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 16px}
.pd-day{display:grid;justify-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.pd-dot{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--surface-soft);color:#b5b7c6;font-size:13px}
.pd-day.done .pd-dot{color:#fff;background:var(--accent)}
.pd-day.today .pd-dot{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
.pd-day.today{color:var(--pink)}
.pd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pd-stat{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-sm);background:var(--surface-soft)}
.pd-stat-ico{font-size:18px}
.pd-stat strong{display:block;font-size:18px;line-height:1.1;letter-spacing:-.4px}
.pd-stat span:last-child{color:var(--muted);font-size:12px}
/* tonight */
.pd-card.pd-challenge{padding:0;background:linear-gradient(105deg,var(--accent-soft),var(--surface))}
.pd-challenge summary,.pd-challenge.empty{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;list-style:none}
.pd-challenge.empty{cursor:default}
.pd-challenge summary::-webkit-details-marker{display:none}
.pd-ch-ico{display:grid;flex:0 0 42px;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--surface);font-size:21px}
.pd-ch-copy{min-width:0;flex:1;display:flex;flex-direction:column}
.pd-ch-copy .pd-eyebrow{color:var(--accent-dark);font-size:.68rem}
.pd-ch-copy strong{margin:3px 0 1px;font-size:15px}
.pd-ch-copy>span:last-child{color:var(--muted);font-size:13px}
.pd-round{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--pline);border-radius:50%;background:var(--surface);color:var(--accent-dark);transition:transform .2s}
.pd-challenge[open] .pd-round{transform:rotate(90deg)}
.pd-why{padding:0 18px 16px 74px;display:grid;gap:8px;font-size:14px;color:var(--pink)}
/* skills */
.pd-sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 12px}
.pd-sec-head p{margin-top:3px}
.pd-key{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.pd-key i{width:10px;height:12px;border-radius:3px 3px 1px 1px;background:var(--accent)}
.pd-skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.pd-skill{border:1px solid var(--pline);border-radius:var(--r-sm);background:var(--surface);--skill-soft:color-mix(in srgb,var(--skill) 14%,var(--surface));transition:border-color .16s}
.pd-skill:hover{border-color:color-mix(in srgb,var(--skill) 45%,var(--pline))}
.pd-skill[open]{grid-column:1/-1;border-color:color-mix(in srgb,var(--skill) 55%,var(--pline))}
.pd-skill summary{display:block;padding:15px;cursor:pointer;list-style:none}
.pd-skill summary::-webkit-details-marker{display:none}
.pd-sk-top{display:flex;align-items:center;gap:10px}
.pd-sk-ico{display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;border-radius:11px;background:var(--skill-soft);font-size:18px}
.pd-sk-name{min-width:0;flex:1;display:flex;flex-direction:column}
.pd-sk-name strong{font-size:15px}
.pd-sk-name span{color:var(--muted);font-size:12px}
.pd-level{padding:4px 9px;border-radius:999px;background:var(--skill-soft);color:color-mix(in srgb,var(--skill) 70%,#000);font-size:11px;font-weight:800;white-space:nowrap}
.pd-delta{font-size:11px;font-weight:800;white-space:nowrap}
.pd-delta.up{color:#23866c}.pd-delta.down{color:#a8641a}
.pd-progress{display:block;height:6px;margin:13px 0 10px;overflow:hidden;border-radius:10px;background:var(--surface-soft)}
.pd-progress span{display:block;height:100%;border-radius:inherit;background:var(--skill)}
.pd-insight{display:flex;gap:8px;color:var(--muted);font-size:12.5px;line-height:1.4}
.pd-insight b{color:var(--pink);font-weight:650}
.pd-spark{display:flex;align-items:end;gap:4px;height:26px;margin-top:12px}
.pd-spark i{flex:1;height:var(--h);min-width:3px;border-radius:3px 3px 1px 1px;background:color-mix(in srgb,var(--skill) 32%,var(--surface))}
.pd-spark i.last{background:var(--skill)}
.pd-spark i.empty{background:var(--surface-soft)}
.pd-more{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:10px;color:var(--accent-dark);font-size:12px;font-weight:750}
.pd-more .opened{display:none}
.pd-skill[open] .pd-more .opened{display:inline}.pd-skill[open] .pd-more .closed{display:none}
.pd-more .chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.pd-skill[open] .pd-more .chev{transform:rotate(-135deg)}
.pd-sk-detail{padding:0 15px 16px;display:grid;gap:14px;border-top:1px solid var(--pline);padding-top:14px;margin:0 15px;padding-left:0;padding-right:0}
.pd-games{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.pd-games li{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--surface-soft);font-size:13px;color:var(--muted)}
.pd-games b{display:block;color:var(--pink);font-size:13.5px}
.pd-gi{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:10px;background:var(--surface);font-size:18px}
.pd-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.pd-facts>div{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.pd-facts b{display:block;color:var(--pink);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
/* play together */
.pd-library .pd-muted{margin:4px 0 14px}
.pd-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.pd-act{position:relative;min-height:104px;display:flex;flex-direction:column;align-items:flex-start;padding:12px;border-radius:var(--r-sm);border:1px solid var(--pline);background:var(--surface);text-align:left;cursor:pointer;transition:transform .16s,border-color .16s}
.pd-act:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--pline))}
.pd-act.open{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pd-act.is-tried{background:color-mix(in srgb,var(--skill) 8%,var(--surface))}
.pd-act-ico{display:grid;place-items:center;width:32px;height:32px;margin-bottom:8px;border-radius:10px;background:color-mix(in srgb,var(--skill) 16%,var(--surface));font-size:17px}
.pd-act strong{font-size:13px;line-height:1.25}
.pd-act-meta{margin-top:auto;padding-top:6px;color:var(--muted);font-size:11.5px}
.pd-tick{color:#23866c;font-weight:700}
.pd-life-panel{margin-top:10px;padding:14px;border-radius:var(--r-sm);background:var(--surface-soft);display:grid;gap:8px;font-size:14px}
.pd-lp-head{display:flex;align-items:center;gap:10px}
.pd-lp-head strong{flex:1;font-size:15px}
.pd-x{border:0;background:var(--surface);width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--muted)}
.pd-tried{display:inline-flex;align-items:center;gap:8px;justify-self:start;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--pline);font-weight:700;font-size:13px;cursor:pointer}
.pd-tried input{width:18px;height:18px;accent-color:var(--accent)}
.pd-lib-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px;padding-top:12px;border-top:1px solid var(--pline);color:var(--muted);font-size:12px}
.pd-minibar{flex:0 0 70px;height:6px;border-radius:6px;background:var(--surface-soft);overflow:hidden}
.pd-minibar span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
/* favourites */
.pd-fav-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.pd-fav{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--surface-soft);font-size:13px;font-weight:650}
/* feedback */
.pd-feedback>.pd-muted{margin-top:4px}
.pd-q{display:block;margin:15px 0 7px;color:var(--pink);font-size:13px;font-weight:700}
.pd-ratings{display:flex;flex-wrap:wrap;gap:7px}
.pd-rate{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--pline);border-radius:12px;background:var(--surface-soft);cursor:pointer;font-size:19px;transition:.15s}
.pd-rate:hover,.pd-rate[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.pd-fb-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pd-text{min-height:60px!important;width:100%;min-height:76px;border:1px solid var(--pline);border-radius:12px;background:var(--surface-soft);padding:10px 12px;font:inherit;color:var(--pink);resize:vertical}
/* share */
.pd-share{padding:15px 18px}
.pd-share-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pd-share-row>span{flex-basis:100%;font-size:15px;font-weight:750;margin-bottom:2px}
.pd-share .pcard{margin-top:12px;width:100%;border-radius:var(--r-sm)}
/* accordions */
.pd-acc{border:1px solid var(--pline);border-radius:var(--r-sm);background:var(--surface);overflow:hidden}
.pd-acc summary{padding:15px 16px;font-size:14px;font-weight:750;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.pd-acc summary::-webkit-details-marker{display:none}
.pd-acc summary::after{content:"+";color:var(--accent);font-size:18px;line-height:18px}
.pd-acc[open] summary::after{content:"−"}
.pd-acc-body{padding:0 16px 16px;display:grid;gap:10px;font-size:14px}
.pd-set .chips{display:flex;flex-wrap:wrap;gap:6px}
.pd .chip{border:1px solid var(--pline);background:var(--surface);color:var(--pink);font:700 13px var(--pfont);padding:8px 12px;min-height:38px;border-radius:999px}
.pd .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pd .btn{background:var(--accent);color:#fff;font:700 13px var(--pfont);padding:9px 14px;min-height:38px;border-radius:999px}
.pd .btn.ghost{background:transparent;color:var(--accent-dark);box-shadow:inset 0 0 0 1px var(--pline)}
.pd .tablewrap table{font-size:13px}
.pd .rules-pic .chg.up{color:#23866c}.pd .rules-pic .arrow{color:var(--accent)}
.pd-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
@media (max-width:900px){.pd-layout{grid-template-columns:minmax(0,1.3fr) minmax(280px,.9fr)}.pd-nav{display:none}}
@media (max-width:760px){
  .pd-top-in,.pd-main{width:min(100% - 28px,560px)}
  .pd-top-in{gap:10px;min-height:60px}
  .pd-tag{display:none}
  .pd-actions{gap:6px}
  .pd-skin button{padding:6px 8px;font-size:11px}
  .pd-play span{display:none}
  .pd-play{padding:8px 12px}
  .pd-main{margin:22px auto 40px}
  .pd-welcome{margin-bottom:16px}
  .pd-date{display:none}
  .pd-layout{grid-template-columns:1fr;gap:15px}
  .pd-col{gap:14px}
  .pd-card{padding:18px}
  .pd-days{gap:3px}
  .pd-stat{gap:8px;padding:10px 9px}
  .pd-stat strong{font-size:16px}
  .pd-why{padding-left:18px}
}
@media (max-width:430px){
  .pd-brand{font-size:16px;gap:8px}.pd-mark{width:28px;height:28px;font-size:15px}
  .pd-avatar.add{display:none}
  .pd-avatar{width:32px;height:32px}
  .pd-skills{grid-template-columns:1fr}
  .pd-stat{flex-direction:column;align-items:flex-start;gap:4px}
  .pd-sec-head{flex-direction:column;align-items:flex-start;gap:6px}
}
@media (max-width:360px){.pd-skin button{padding:5px 7px}.pd-brand .pd-word{display:none}}
@media (prefers-reduced-motion:reduce){.pd *{transition:none!important}}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<main id="app" class="app"></main>
<script>
(() => {
'use strict';
const KEY = 'mindmint-proto-v2', OLD_KEY = 'mindmint-proto-v1';
const SKILLS = ['memory', 'focus', 'numbers', 'noticing', 'logic', 'words'];
const SKILL_NAME = { memory: 'Memory', focus: 'Focus', numbers: 'Numbers', noticing: 'Noticing', logic: 'Logic', words: 'Words' };
const SKILL_PLAIN = {
  memory: 'Holding things in mind for a short time: working memory.',
  focus: 'Staying on task and holding back when needed: attention and self-control.',
  numbers: 'Understanding amounts and adding in your head: number sense.',
  noticing: 'Spotting details and seeing patterns in space: visual attention.',
  logic: 'Finding rules and switching between them: reasoning and flexible thinking.',
  words: 'Sorting and building words: vocabulary and early reading.'
};
const SKILL_GAMES = { memory: ['trail', 'picnic'], focus: ['lily', 'frogs'], numbers: ['berry', 'more'], noticing: ['odd', 'mirror'], logic: ['next', 'sort'], words: ['cat', 'word'] };
const MAX_KIDS = 4;
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = s => document.querySelector(s);
const app = $('#app');

/* ---------- Level rules: each maps a skill level (1 to 10) to that game's settings ---------- */
const TRAIL = l => ({ grid: l <= 3 ? 3 : 4, len: Math.min(l + 1, 9), speed: Math.max(420, 720 - l * 30) });
const PICNIC = l => ({ n: Math.min(l + 2, 10), show: Math.max(2600, 5200 - l * 250), moved: l >= 3 });
const LILY = l => { const n = l <= 2 ? 3 : l <= 5 ? 4 : 5; const cells = n * n; return { n, cells, limit: Math.max(Math.round(cells * 1.1), Math.round(cells * (2.6 - 0.13 * l))) }; };
const FROGS = l => ({ win: Math.max(650, 1500 - l * 85), nogo: Math.min(0.4, 0.22 + l * 0.02), count: 10 });
const BERRY = l => [[5, 2], [10, 2], [10, 3], [20, 2], [20, 3], [30, 3], [50, 2], [50, 3], [100, 2], [100, 3]][l - 1];
const MORE_DESC = ['compares groups of up to 5 dots', 'compares groups of up to 10 dots', 'compares numbers up to 20', 'compares two-digit numbers', 'compares a small sum with a number', 'compares two small sums', 'compares two-digit sums with numbers', 'compares two sums up to 100', 'compares two subtractions', 'compares two times-table facts'];
const ODD = l => ({ n: [2, 3, 3, 4, 4, 5, 5, 5, 6, 6][l - 1], d: [26, 22, 18, 16, 13, 12, 10, 8, 7, 6][l - 1] });
const MIRROR = l => { const t = [[2, 4, 2], [3, 4, 3], [3, 6, 4], [4, 6, 5], [4, 6, 6], [4, 8, 7], [5, 8, 8], [5, 8, 10], [6, 8, 11], [6, 10, 13]][l - 1]; return { rows: t[0], cols: t[1], k: t[2] }; };
const NEXT_DESC = ['continues a two-colour pattern', 'continues a three-part colour pattern', 'continues a three-shape pattern', 'continues a growing pattern', 'continues a number pattern that adds 2', 'continues a pattern where shape and colour change separately', 'continues number patterns that add or subtract', 'continues doubling patterns', 'continues patterns with alternating steps', 'continues two patterns woven together'];
const SORT = l => ({ mode: l <= 4 ? 'word' : l <= 6 ? 'icon' : 'border', every: [0, 0, 4, 3, 3, 0, 0, 0, 0, 0][l - 1], once: l === 2, random: l === 6, limit: [0, 0, 0, 0, 0, 0, 0, 3200, 2600, 2100][l - 1] });
const SORT_DESC = ['sorts cards by one rule (colour)', 'switches from sorting by colour to sorting by shape', 'switches rules every 4 cards', 'switches rules every 3 cards', 'switches rules every 3 cards with only a symbol as the cue', 'switches rules on any card with only a symbol as the cue', 'follows a two-part rule: border means shape, no border means colour', 'uses the two-part rule within 3.2 seconds per card', 'uses the two-part rule within 2.6 seconds per card', 'uses the two-part rule within 2.1 seconds per card'];
const CATS = [{ tag: 'animal', label: 'animals', n: 6, k: 2 }, { tag: 'fruit', label: 'fruits', n: 6, k: 3 }, { tag: 'wheels', label: 'things with wheels', n: 9, k: 3 }, { tag: 'wear', label: 'things you wear', n: 9, k: 4 }, { tag: 'fruit', label: 'fruits (not vegetables)', n: 9, k: 4, pool: ['veg'] }, { tag: 'flies', label: 'things that fly', n: 12, k: 4 }, { tag: 'water', label: 'things found in water', n: 12, k: 4 }, { tag: 'veg', label: 'vegetables (not fruits)', n: 12, k: 5, pool: ['fruit'] }, { tag: 'wheels', label: 'things with wheels', n: 16, k: 5 }, { tag: 'flies', label: 'things that fly', n: 16, k: 5 }];
const WORD = l => { const t = [[3, 0, true], [3, 0, false], [4, 0, false], [4, 1, false], [5, 0, false], [5, 2, false], [6, 0, false], [6, 2, false], [7, 0, false], [7, 3, false]][l - 1]; return { len: t[0], extra: t[1], ghost: t[2] }; };
const diffWord = d => d >= 18 ? 'big' : d >= 12 ? 'medium' : d >= 8 ? 'small' : 'tiny';
const noTimer = () => !!(P() && P().child.noTimer);

const GAMES = {
  trail: { name: 'Firefly Trail', skill: 'memory', trials: 5, what: 'remembering the order of places',
    meaning: l => { const c = TRAIL(l); return `remembers a ${c.len}-step path on a ${c.grid}×${c.grid} grid`; }, kid: l => `paths of ${TRAIL(l).len} steps` },
  picnic: { name: 'Picnic Recall', skill: 'memory', trials: 5, what: 'remembering a group of things',
    meaning: l => { const c = PICNIC(l); return `spots which of ${c.n} picnic items went missing${c.moved ? ', even after they are moved around' : ''}`; }, kid: l => `${PICNIC(l).n} picnic things` },
  lily: { name: 'Lily Pad Count-Up', skill: 'focus', trials: 3, what: 'finding numbers in order, quickly and carefully',
    meaning: l => { const c = LILY(l); return noTimer() ? `finds 1 to ${c.cells} in order (no time limit)` : `finds 1 to ${c.cells} in order within ${c.limit} seconds`; }, kid: l => `numbers up to ${LILY(l).cells}` },
  frogs: { name: 'Stop & Go Frogs', skill: 'focus', trials: 3, what: 'tapping at the right time and holding back at the wrong time',
    meaning: l => noTimer() ? 'taps green frogs and holds back on red ones (relaxed pace)' : `taps green frogs and holds back on red ones, with ${(FROGS(l).win / 1000).toFixed(1)} seconds to decide`, kid: l => (noTimer() ? 'slow frogs' : `${(FROGS(l).win / 1000).toFixed(1)}-second frogs`) },
  berry: { name: 'Berry Sums', skill: 'numbers', trials: 5, what: 'making a total by adding numbers',
    meaning: l => { const [m, k] = BERRY(l); return `makes totals up to ${m} using ${k} numbers`; }, kid: l => `totals up to ${BERRY(l)[0]}` },
  more: { name: 'Which Has More?', skill: 'numbers', trials: 6, what: 'comparing amounts and numbers',
    meaning: l => MORE_DESC[l - 1], kid: l => MORE_DESC[l - 1].replace('compares ', '') },
  odd: { name: 'Odd Glow Out', skill: 'noticing', trials: 6, what: 'spotting the one thing that is different',
    meaning: l => { const c = ODD(l); return `spots 1 different lantern among ${c.n * c.n} (${diffWord(c.d)} difference)`; }, kid: l => `${ODD(l).n * ODD(l).n} lanterns` },
  mirror: { name: 'Mirror Garden', skill: 'noticing', trials: 4, what: 'copying a pattern as a mirror image',
    meaning: l => { const c = MIRROR(l); return `mirrors a pattern of ${c.k} flowers on a ${c.rows}×${c.cols} grid`; }, kid: l => `${MIRROR(l).k}-flower patterns` },
  next: { name: 'What Comes Next?', skill: 'logic', trials: 6, what: 'finding the rule in a pattern',
    meaning: l => NEXT_DESC[l - 1], kid: l => NEXT_DESC[l - 1].replace('continues ', '') },
  sort: { name: 'Sort Switch', skill: 'logic', trials: 3, what: 'sorting by a rule, then switching rules',
    meaning: l => (noTimer() && l >= 8) ? SORT_DESC[6] + ' (no time limit)' : SORT_DESC[l - 1], kid: l => (SORT(l).mode === 'border' ? 'two-part rules' : SORT(l).every || SORT(l).once || SORT(l).random ? 'switching rules' : 'one rule') },
  cat: { name: 'Category Catch', skill: 'words', trials: 4, what: 'finding everything that belongs to a group',
    meaning: l => `finds all the ${CATS[l - 1].label} among ${CATS[l - 1].n} pictures`, kid: l => CATS[l - 1].label },
  word: { name: 'Word Builder', skill: 'words', trials: 4, what: 'building a word, sound by sound',
    meaning: l => { const c = WORD(l); return `spells ${c.len}-letter words from a picture${c.extra ? ` with ${c.extra} extra letter${c.extra > 1 ? 's' : ''} mixed in` : c.ghost ? ' with letter hints' : ''}`; }, kid: l => `${WORD(l).len}-letter words` }
};

/* Strategies: the first option is always the stronger trick; the third is the weaker one. */
const STRATS = {
  trail: { q: 'What helped you remember the path?', best: 'See the path as a shape', opts: [['shape', 'I saw it as a shape'], ['say', 'I said the places in my head'], ['watch', 'I just watched closely']],
    tip: { shape: 'Great trick! Turning a path into a shape, like an L or a zigzag, makes it easier to hold.', say: 'Saying it in your head is a real memory trick. Try adding the shape trick too!', watch: 'Next time, try seeing the path as a shape, like a letter L or a zigzag.', none: 'Here is a trick to try: see the path as a shape, like a letter L or a zigzag.' },
    name: { shape: 'saw the path as a shape', say: 'said the places silently', watch: 'watched without a trick', none: 'was not sure which trick they used' } },
  picnic: { q: 'How did you remember the picnic?', best: 'Make a silly story with the items', opts: [['story', 'I made a little story'], ['names', 'I said their names'], ['look', 'I just looked']],
    tip: { story: 'Stories are a super memory trick. The sillier, the better!', names: 'Saying names helps. Try joining them into a silly story too!', look: 'Next time, say each name, or make a quick story like "the mango sat on the cheese".', none: 'A trick to try: make a silly story with the items, like "the mango sat on the cheese".' },
    name: { story: 'made a story with the items', names: 'said the names', look: 'just looked', none: 'was not sure which trick they used' } },
  lily: { q: 'How did you look for the next number?', best: 'Sweep row by row, like reading', opts: [['rows', 'Row by row'], ['remember', 'I remembered where it was'], ['everywhere', 'I looked everywhere']],
    tip: { rows: 'Row by row is what experts do. Keep it up!', remember: 'Smart! Noticing where numbers sit saves time.', everywhere: 'Try sweeping row by row, like reading a book. It is calmer and faster.', none: 'A trick to try: sweep row by row, like reading a book.' },
    name: { rows: 'scanned row by row', remember: 'remembered where numbers were', everywhere: 'searched everywhere', none: 'was not sure which trick they used' } },
  frogs: { q: 'How did you stop yourself on red frogs?', best: 'Check the colour before you tap', opts: [['check', 'I checked the colour first'], ['say', 'I said "go" or "stop" in my head'], ['fast', 'I tapped as fast as I could']],
    tip: { check: 'Checking first is the secret. A tiny pause makes you more accurate.', say: 'Talking to yourself is a real self-control trick. Nice!', fast: 'Speed is fun, but a tiny pause to check the colour wins more frogs.', none: 'A trick to try: look at the colour first, then tap.' },
    name: { check: 'checked the colour before tapping', say: 'said "go" or "stop" silently', fast: 'tapped as fast as possible', none: 'was not sure which trick they used' } },
  berry: { q: 'How did you make the total?', best: 'Start with the biggest berry that fits', opts: [['big', 'Started with the biggest berry'], ['count', 'Counted on from one number'], ['guess', 'Tried and checked']],
    tip: { big: 'Starting big, then filling the gap, is a strong strategy.', count: 'Counting on is a great way to add. Try starting from the bigger number.', guess: 'Trying and checking is fine! Next time, start with the biggest berry that fits.', none: 'Try this: pick the biggest berry that fits, then find what is left.' },
    name: { big: 'started with the biggest number', count: 'counted on', guess: 'tried and checked', none: 'was not sure which trick they used' } },
  more: { q: 'How did you decide which had more?', best: 'Work out both sides before choosing', opts: [['work', 'I worked out both sides'], ['estimate', 'I guessed, then checked'], ['quick', 'I picked the one that looked bigger']],
    tip: { work: 'Working out both sides is exactly right. That is how mathematicians do it.', estimate: 'Guess then check is a great habit!', quick: 'Looks can trick you! Work out both sides before you choose.', none: 'A trick to try: work out each side first, then compare.' },
    name: { work: 'worked out both sides', estimate: 'estimated, then checked', quick: 'picked what looked bigger', none: 'was not sure which trick they used' } },
  odd: { q: 'How did you spot the different lantern?', best: 'Scan in rows so you never miss one', opts: [['rows', 'I scanned in rows'], ['pop', 'It popped out at me'], ['compare', 'I compared pairs']],
    tip: { rows: 'Scanning in rows means you never miss a spot. Nice!', pop: 'Quick eyes! When it gets harder, try scanning in rows.', compare: 'Comparing is careful work. Rows can make it faster.', none: 'Try scanning row by row so you never miss one.' },
    name: { rows: 'scanned in rows', pop: 'spotted it at a glance', compare: 'compared pairs', none: 'was not sure which trick they used' } },
  mirror: { q: 'How did you copy the pattern?', best: 'Count steps from the middle line', opts: [['steps', 'I counted steps from the middle line'], ['row', 'I went row by row'], ['look', 'I just looked']],
    tip: { steps: 'Counting from the mirror line is the perfect trick!', row: 'Row by row keeps you organised. Add counting from the middle line too!', look: 'Try counting how far each flower is from the middle line.', none: 'A trick to try: count how many steps each flower is from the middle line.' },
    name: { steps: 'counted steps from the mirror line', row: 'went row by row', look: 'just looked', none: 'was not sure which trick they used' } },
  next: { q: 'How did you find what comes next?', best: 'Find the rule, then say it out loud', opts: [['rule', 'I found the rule'], ['say', 'I said the pattern out loud'], ['guess', 'I guessed']],
    tip: { rule: 'Finding the rule is real detective work. Brilliant!', say: 'Saying it out loud helps you hear the rule. Nice!', guess: 'Next time, say the pattern out loud: "red, blue, red, blue…" The rule pops out.', none: 'A trick to try: say the pattern out loud and listen for the rule.' },
    name: { rule: 'found the rule', say: 'said the pattern aloud', guess: 'guessed', none: 'was not sure which trick they used' } },
  sort: { q: 'How did you keep track of the rule?', best: 'Check the rule before every card', opts: [['check', 'I checked the rule every time'], ['say', 'I said the rule in my head'], ['fast', 'I just went fast']],
    tip: { check: 'Checking the rule every time is exactly what good thinkers do.', say: 'Saying the rule to yourself is a strong trick!', fast: 'Going fast is fun, but checking the rule first wins more cards.', none: 'A trick to try: look at the rule before every single card.' },
    name: { check: 'checked the rule each time', say: 'said the rule silently', fast: 'went as fast as possible', none: 'was not sure which trick they used' } },
  cat: { q: 'How did you find them all?', best: 'Check every picture, one by one', opts: [['each', 'I checked every picture'], ['name', 'I said each name'], ['quick', 'I tapped the first ones I saw']],
    tip: { each: 'Checking every picture means nothing gets missed. Great!', name: 'Saying names helps your brain decide. Nice trick!', quick: 'Next time, check every picture one by one so none hide from you.', none: 'A trick to try: check each picture in order, row by row.' },
    name: { each: 'checked every picture', name: 'said each name', quick: 'tapped the first ones seen', none: 'was not sure which trick they used' } },
  word: { q: 'How did you build the word?', best: 'Say the word slowly and listen for each sound', opts: [['sound', 'I said the sounds slowly'], ['look', 'I looked for letters I knew'], ['guess', 'I tried letters']],
    tip: { sound: 'Stretching the word out, like "c-a-t", is how good readers spell.', look: 'Spotting letters you know is smart. Add saying the sounds slowly too!', guess: 'Try saying the word slowly, sound by sound. The letters follow.', none: 'A trick to try: say the word very slowly and listen for each sound.' },
    name: { sound: 'sounded the word out', look: 'looked for known letters', guess: 'tried letters', none: 'was not sure which trick they used' } }
};
const isWeak = (g, v) => v === 'none' || (STRATS[g] && STRATS[g].opts[2][0] === v);

/* Everyday activities: two per skill, each tied to one game. */
const LIFE = {
  memory: [
    { game: 'trail', kid: 'Shopping list challenge: remember 4 things to buy without writing them down.', parent: 'Shopping-list game: give 3 or 4 items to remember on the way to the shop. Add one more when it feels easy.', ask: '"How did you remember them all? Did you make a picture or a story?"' },

/* Spaced comebacks: focus skills every day; other skills return after growing gaps (1, 2, 4, then 7 days). */
function nextDue(p, skill) {
  if (p.child.focus.includes(skill)) return { due: true, overdue: 0, label: 'every day (a focus skill)' };
  const entries = p.log.filter(e => e.skill === skill);
  if (!entries.length) return { due: true, overdue: 99, label: 'not started yet, joins soon' };
  const days = new Set(entries.map(e => dk(e.ts))).size;
  const gap = [1, 2, 4, 7][Math.min(days - 1, 3)];
  const left = gap - daysBetween(entries[entries.length - 1].ts, Date.now());
  return { due: left <= 0, overdue: -left, gap, label: left <= 0 ? `due now (review gap: ${gap} day${gap > 1 ? 's' : ''})` : `in ${left} day${left > 1 ? 's' : ''} (review gap: ${gap} day${gap > 1 ? 's' : ''})` };
}
function pickGame(p, s) { return SKILL_GAMES[s].slice().sort((a, b) => lastPlayedGame(p, a) - lastPlayedGame(p, b))[0]; }
function buildPlan(p) {
  const count = { 5: 2, 10: 3, 15: 4 }[p.child.minutes] || 3;
  const skills = p.child.focus.slice(0, 2).slice(0, count);
  const rest = SKILLS.filter(s => !skills.includes(s)).map(s => ({ s, d: nextDue(p, s) })).sort((a, b) => (b.d.due - a.d.due) || (b.d.overdue - a.d.overdue));
  while (skills.length < count && rest.length) skills.push(rest.shift().s);
  return skills.map(s => pickGame(p, s));
}

  const prev = [...p.log].reverse().find(e => dk(e.ts) !== todayKey() && e.strategy);
  if (!prev) return null;
  const correct = STRATS[prev.game].best;
  const others = shuffle(Object.keys(STRATS).filter(g => GAMES[g].skill !== prev.skill).map(g => STRATS[g].best)).slice(0, 2);
  return { game: prev.game, correct, opts: shuffle([correct, ...others]), answer: null };
}

}

function speak(t) {

    const u = new SpeechSynthesisUtterance(text); u.lang = hi ? 'hi-IN' : 'en-IN'; u.rate = hi ? 0.9 : 0.95; u.pitch = 1.1;
    const v = (speechSynthesis.getVoices() || []).find(x => x.lang && x.lang.toLowerCase().replace('_', '-').startsWith(hi ? 'hi' : 'en-in')) || (!hi && (speechSynthesis.getVoices() || []).find(x => x.lang && x.lang.toLowerCase().startsWith('en')));

  let i = LIFE[skill].findIndex(a => a.game === g); if (i < 0) i = 0;
  return Object.assign({ icon: LIFE_META[skill][i][0], kidHi: KID_HI[skill][i] }, LIFE[skill][i]);
}
