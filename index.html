/* ---------- Parent view ---------- */

function spark(pts) {
  const W = 280, H = 64, n = pts.length;
  const X = i => 26 + i * (W - 34) / (n - 1), Y = v => 8 + (10 - v) / 9 * (H - 16);
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const area = `${line} L${X(n - 1).toFixed(1)} ${Y(1).toFixed(1)} L${X(0).toFixed(1)} ${Y(1).toFixed(1)} Z`;
  return `<figure class="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Level after each of the last ${n - 1} sessions, from ${pts[0]} to ${pts[n - 1]}">
    <line x1="26" x2="${W - 8}" y1="${Y(10)}" y2="${Y(10)}" class="g"/><line x1="26" x2="${W - 8}" y1="${Y(1)}" y2="${Y(1)}" class="g"/>
    <text x="0" y="${Y(10) + 4}" class="t">L10</text><text x="0" y="${Y(1) + 4}" class="t">L1</text>
    <path d="${area}" class="a"/><path d="${line}" class="l"/><circle cx="${X(n - 1)}" cy="${Y(pts[n - 1])}" r="4.5" class="d"/></svg>
    <figcaption>Level at the start, then after each of the last ${n - 1} sessions</figcaption></figure>`;
}
function changesText(e) {
  const ups = e.changes.filter(c => c.dir === 'up').length, downs = e.changes.filter(c => c.dir === 'down').length;
  if (!ups && !downs) return e.levelEnd === 10 ? 'Already at the top level.' : 'No change: right answers never came two in a row.';
  const parts = [];
  if (ups) parts.push(`up ${ups} step${ups > 1 ? 's' : ''} (two right in a row${ups > 1 ? ', ' + ups + ' times' : ''})`);
  if (downs) parts.push(`down ${downs} step${downs > 1 ? 's' : ''} (after ${downs} miss${downs > 1 ? 'es' : ''})`);
  return 'Went ' + parts.join(' and ') + '.';
}
function skillCard(p, s) {
  const lv = p.skills[s].level;
  const hist = p.log.filter(e => e.skill === s);
  const last = hist[hist.length - 1];
  const recent = hist.slice(-12);
  const pts = recent.length ? [recent[0].levelStart, ...recent.map(e => e.levelEnd)] : [];
  const trend = last ? (last.levelEnd > last.levelStart ? 'up' : last.levelEnd < last.levelStart ? 'down' : 'steady') : 'new';
  const pill = { up: 'Moved up', down: 'Eased off', steady: 'Steady', new: 'Not played yet' }[trend];
  const inToday = p.today && p.today.date === todayKey() && p.today.plan.some(g => GAMES[g].skill === s);
  const due = inToday ? { label: "in today's plan" } : nextDue(p, s);
  return `<article class="skill">
    <header><div><p class="eyebrow">${SKILL_NAME[s]}</p><div class="level"><span class="lv">${lv}</span><span class="of">of 10</span></div></div><span class="pill ${trend}">${pill}</span></header>
    <p class="soft">${SKILL_PLAIN[s]}</p>
    <ul class="means">${SKILL_GAMES[s].map(g => `<li>${esc(p.child.name)} ${GAMES[g].meaning(lv)}<span>in ${GAMES[g].name}</span></li>`).join('')}</ul>
    ${pts.length > 2 ? spark(pts) : ''}
    <dl>
      ${last ? `<div><dt>Last session</dt><dd>${GAMES[last.game].name}: ${last.correct} of ${last.trials} right · ${fmtSec(last.avgMs)} per try · ${fmtDate(last.ts)}</dd></div>
      <div><dt>Why the level changed</dt><dd>${changesText(last)}</dd></div>
      <div><dt>Trick they used</dt><dd>${last.strategy ? STRATS[last.game].name[last.strategy] : 'not answered'}</dd></div>` : ''}
      <div><dt>Comes back</dt><dd>${due.label}</dd></div>
    </dl>
  </article>`;
}
function lifeCard(p, s) {
  const wk = weekKey(), q = (p.quests[wk] || {});
  return `<article class="lifecard"><p class="eyebrow">${SKILL_NAME[s]}</p>${LIFE[s].map((a, i) => {
    const id = `${s}-${i}`;
    return `<div class="act"><h3>${a.parent}</h3><p class="soft">Same skill as ${GAMES[a.game].name}.</p><p><strong>Ask:</strong> ${a.ask}</p>
    <label class="check" for="q-${id}"><input type="checkbox" id="q-${id}" data-act="quest" data-k="${id}" ${q[id] ? 'checked' : ''}><span>Tried it this week</span></label></div>`;
  }).join('')}</article>`;
}

function weekData(p) {
  const ws = weekStart(), entries = p.log.filter(e => e.ts >= ws);
  const days = new Set(entries.map(e => dk(e.ts))).size;
  const mins = Math.round(entries.reduce((a, e) => a + durOf(e), 0) / 60000);
  const skills = SKILLS.map(s => { const es = entries.filter(e => e.skill === s); return { s, from: es.length ? es[0].levelStart : null, to: p.skills[s].level, played: es.length }; });
  const q = p.quests[weekKey()] || {}, tried = Object.values(q).filter(Boolean).length;
  const weakest = skills.filter(x => x.played).sort((a, b) => (a.to - (a.from || a.to)) - (b.to - (b.from || b.to)))[0];
  return { entries, days, mins, skills, tried, weakest };
}
function weekText(p) {
  const w = weekData(p), name = p.child.name;
  const lines = [`Mindmint weekly update: ${name}, week of ${fmtDate(weekStart())}`, '', `Practised on ${w.days} of 7 days, about ${w.mins} minutes in total.`];
  w.skills.forEach(x => {
    const g = GAMES[SKILL_GAMES[x.s][0]];
    if (x.played) lines.push(`${SKILL_NAME[x.s]}: level ${x.from} → ${x.to}. Now ${g.meaning(x.to)} (${g.name}).`);
    else lines.push(`${SKILL_NAME[x.s]}: not practised this week (level ${x.to}).`);
  });
  lines.push(`Everyday activities tried: ${w.tried} of ${SKILLS.length * 2}.`);
  if (w.weakest) { const a = LIFE[w.weakest.s][0]; lines.push('', `Idea for next week (${SKILL_NAME[w.weakest.s]}): ${a.parent}`); }
  lines.push('', 'Levels describe these exact activities only. They are not an IQ score or a school grade.');
  return lines.join('\n');
}
function weekCard(p) {
  const w = weekData(p);
  return `<section class="card"><p class="eyebrow">This week · since ${fmtDate(weekStart())}</p><h2>Weekly summary</h2>
    <div class="weekgrid">
      <div><b>${w.days} of 7 days</b><span class="soft">practised</span></div>
      <div><b>about ${w.mins} min</b><span class="soft">in total</span></div>
      ${w.skills.map(x => `<div><b>${SKILL_NAME[x.s]}: ${x.played ? `${x.from} → ${x.to}` : `${x.to}, not played`}</b><span class="soft">level this week</span></div>`).join('')}
      <div><b>${w.tried} of ${SKILLS.length * 2}</b><span class="soft">everyday activities tried</span></div>
    </div>
    <div class="row"><a class="btn small" href="${waLink(weekText(p))}" target="_blank" rel="noopener">Send on WhatsApp</a><button class="btn small ghost" data-act="copy-week">Copy summary</button><span class="soft" id="copy-status" role="status"></span></div>
    ${S.copyText ? `<label for="copy-box" class="soft">Your browser blocked copying. Select the text below and copy it yourself.</label><textarea id="copy-box" readonly>${esc(S.copyText)}</textarea>` : ''}
  </section>`;
}

const waLink = t => 'https://wa.me/?text=' + encodeURIComponent(t);
function funSummary(p) {
  const by = {};
  p.log.forEach(e => { if (e.fun == null) return; (by[e.game] = by[e.game] || []).push(e.fun); });
  return Object.entries(by).map(([g, v]) => ({ g, avg: v.reduce((a, b) => a + b, 0) / v.length, n: v.length })).sort((a, b) => b.avg - a.avg);
}
function funLine(p) {
  const f = funSummary(p), loved = f.filter(x => x.avg >= 1.5).slice(0, 3).map(x => GAMES[x.g].name), meh = f.filter(x => x.avg < 1).map(x => GAMES[x.g].name);
  if (!f.length) return '';
  return (loved.length ? `Loved: ${loved.join(', ')}.` : '') + (meh.length ? ` Not keen on: ${meh.join(', ')}.` : '');
}
function feedbackText(p) {

  const lines = ['Mindmint prototype feedback', '', `Child's age band: ${p.child.band.replace('-', ' to ')}`, `Played on ${days} day${days === 1 ? '' : 's'}, ${p.log.length} game${p.log.length === 1 ? '' : 's'} in total`];
  if (f.enjoy) lines.push(`Child enjoyed it: ${f.enjoy} out of 5`);
  if (f.useful) lines.push(`Levels and parent notes were useful: ${f.useful} out of 5`);

function noteCard(p, todays) {

  if (up.length) {
    const e = up[0], g = GAMES[e.game];
    head = `${GAME_ICON[e.game]} ${SKILL_NAME[g.skill]} went up to level ${e.levelEnd}`;
    body = `In ${g.name}, ${name} now ${g.meaning(e.levelEnd)}.` + (e.strategy && e.strategy !== 'none' ? ` They said they ${STRATS[e.game].name[e.strategy]}.` : '') + ' Naming the trick helps them use it again.';
    say = `"What trick helped you on ${g.name.replace(/\?$/, '')}?"`;

}

async function trailTrial(board, l, ui) {
  const c = TRAIL(l), N = c.grid * c.grid;
  board.innerHTML = `<div class="grid" style="grid-template-columns:repeat(${c.grid},1fr)">${Array.from({ length: N }, (_, i) => `<button class="cell" data-i="${i}" aria-label="Spot ${i + 1}" disabled></button>`).join('')}</div>`;
  const cells = [...board.querySelectorAll('.cell')];
  const path = shuffle([...Array(N).keys()]).slice(0, c.len);
  ui.say('Watch the fireflies…');
  await wait(900);
  for (const i of path) {
    if (!ui.alive()) return { correct: false, ms: 0 };
    cells[i].classList.add('lit'); await wait(c.speed); cells[i].classList.remove('lit'); await wait(180);
  }
  ui.say('Your turn. Tap the same path.');
  cells.forEach(b => { b.disabled = false; });
  const t0 = performance.now();
  return new Promise(resolve => {
    let step = 0, over = false;
    board.onclick = async e => {
      const b = e.target.closest('.cell'); if (!b || over) return;
      const i = +b.dataset.i;
      if (i === path[step]) {
        b.classList.add('tap'); setTimeout(() => b.classList.remove('tap'), 250); step++; sfx('tap');
        if (step === path.length) { over = true; cells.forEach(x => { x.disabled = true; }); resolve({ correct: true, ms: performance.now() - t0 }); }
      } else {
        over = true; cells.forEach(x => { x.disabled = true; }); b.classList.add('miss');
        ui.say("Let's watch it again, slowly.");
        await wait(700); b.classList.remove('miss');
        for (let s = 0; s < path.length; s++) {
          if (!ui.alive()) break;
          const cell = cells[path[s]]; cell.classList.add('lit'); cell.textContent = s + 1; await wait(650); cell.classList.remove('lit');
        }
        await wait(700);
        resolve({ correct: false, ms: performance.now() - t0 });
      }
    };
  });
}

async function picnicTrial(board, l, ui) {
  const c = PICNIC(l), pool = shuffle(ITEMS.slice()), items = pool.slice(0, c.n), missing = rand(0, c.n - 1);
  const show = it => `<span class="item">${it[0]}<small>${it[1]}</small></span>`;
  board.innerHTML = `<div class="basket" aria-label="Picnic items">${items.map(show).join('')}</div>`;
  ui.say('Look at the picnic! Remember everything.');
  await wait(c.show);
  if (!ui.alive()) return { correct: false, ms: 0 };
  const left = items.filter((_, i) => i !== missing), shown = c.moved ? shuffle(left.slice()) : left;
  const choices = shuffle([items[missing], ...pool.slice(c.n, c.n + 3)]);
  board.innerHTML = `<div class="basket">${shown.map(show).join('')}</div><p class="q">What went missing?</p><div class="choices">${choices.map((it, i) => `<button class="choice" data-i="${i}">${it[0]}<small>${it[1]}</small></button>`).join('')}</div>`;
  ui.say(c.moved ? 'Everything got mixed up! What went missing?' : 'What went missing?');
  const t0 = performance.now(), btns = [...board.querySelectorAll('.choice')], ans = choices.indexOf(items[missing]);
  return new Promise(resolve => {
    let over = false;
    board.onclick = async e => {
      const b = e.target.closest('.choice'); if (!b || over) return; over = true;
      btns.forEach(x => { x.disabled = true; });
      const i = +b.dataset.i;
      if (i === ans) { b.classList.add('right'); resolve({ correct: true, ms: performance.now() - t0 }); }
      else { b.classList.add('wrong'); btns[ans].classList.add('right'); ui.say(`It was the ${items[missing][1]}.`); await wait(1600); resolve({ correct: false, ms: performance.now() - t0 }); }
    };
  });
}

function lilyTrial(board, l, ui) {
  const c = LILY(l), relaxed = noTimer();
  const nums = shuffle(Array.from({ length: c.cells }, (_, i) => i + 1));
  board.innerHTML = `<div class="timer" id="timer">${relaxed ? 'No time limit' : `0 s · goal ${c.limit} s`}</div><div class="grid" style="grid-template-columns:repeat(${c.n},1fr)">${nums.map(n => `<button class="pad" data-n="${n}">${n}</button>`).join('')}</div>`;
  ui.say(`Tap 1, then 2, then 3… all the way to ${c.cells}.`);
  const t0 = performance.now(), timerEl = board.querySelector('#timer');
  let target = 1, misses = 0, sinceHit = 0;
  const iv = relaxed ? null : setInterval(() => {
    if (!ui.alive()) { clearInterval(iv); return; }
    const s = Math.floor((performance.now() - t0) / 1000);
    timerEl.textContent = `${s} s · goal ${c.limit} s`; timerEl.classList.toggle('over', s > c.limit);
  }, 250);
  return new Promise(resolve => {
    board.onclick = e => {
      const b = e.target.closest('.pad'); if (!b || b.classList.contains('found')) return;
      const n = +b.dataset.n;
      if (n === target) {
        b.classList.add('found'); b.classList.remove('hint'); target++; sinceHit = 0; sfx('tap');
        if (target > c.cells) {
          if (iv) clearInterval(iv);
          const ms = performance.now() - t0, slow = !relaxed && ms > c.limit * 1000, ok = !slow && misses <= 2;
          resolve({ correct: ok, ms, note: ok ? null : slow ? 'All found! That one took longer than the goal.' : 'All found! A few wrong taps on that one.' });
        }
      } else {
        misses++; sinceHit++; b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400);
        if (sinceHit >= 2) { const t = board.querySelector(`.pad[data-n="${target}"]`); if (t) t.classList.add('hint'); ui.say(`Here is ${target}. Try sweeping row by row.`); }
      }
    };
  });
}

async function frogsTrial(board, l, ui) {
  const c = FROGS(l), win = noTimer() ? 2400 : c.win;
  const nNo = Math.max(2, Math.round(c.count * c.nogo));
  const seq = shuffle([...Array(nNo).fill(false), ...Array(c.count - nNo).fill(true)]);
  board.innerHTML = `<div class="legend"><span><i class="g"></i>Green frog: tap!</span><span><i class="r"></i>Red frog with a hand: don't tap</span></div><div class="pond">${Array.from({ length: 9 }, () => '<div class="spot"></div>').join('')}</div><p class="soft" id="frog-count">Frog 0 of ${c.count}</p>`;
  ui.say('Tap the green frogs. Hold still for the red ones!');
  await wait(1500);
  const spots = [...board.querySelectorAll('.spot')], countEl = board.querySelector('#frog-count');
  let mistakes = 0; const rts = [];
  for (let i = 0; i < seq.length; i++) {
    if (!ui.alive()) return { correct: false, ms: 0 };
    countEl.textContent = `Frog ${i + 1} of ${c.count}`;
    const go = seq[i], spot = pick(spots);
    const r = await new Promise(res => {
      const b = document.createElement('button');
      b.className = 'frog ' + (go ? 'go' : 'stop'); b.textContent = go ? '' : '✋';
      b.setAttribute('aria-label', go ? 'Green frog: tap it' : 'Red frog: do not tap');
      spot.appendChild(b);
      const t0 = performance.now(); let done = false, to = null;
      const end = tapped => { if (done) return; done = true; clearTimeout(to); b.remove(); res({ tapped, rt: performance.now() - t0 }); };
      b.onclick = () => end(true);
      to = setTimeout(() => end(false), win);
    });
    const ok = go ? r.tapped : !r.tapped;
    if (go && r.tapped) rts.push(r.rt);
    if (!ok) mistakes++;
    spot.classList.add(ok ? 'okflash' : 'badflash');
    if (!ok) ui.say(go ? 'Missed a green one. Keep watching!' : 'Oops, that frog was red. Check the colour first.');
    await wait(260); spot.classList.remove('okflash', 'badflash');
    await wait(rand(250, 550));
  }
  const ms = rts.length ? rts.reduce((a, b) => a + b, 0) / rts.length : win;
  return { correct: mistakes <= 1, ms, note: mistakes <= 1 ? null : `${c.count - mistakes} of ${c.count} frogs right.` };
}

function numbersTrial(board, l, ui) {
  const [max, k] = BERRY(l);
  const target = rand(Math.max(k + 1, Math.ceil(max * 0.4)), max);
  const cuts = new Set(); while (cuts.size < k - 1) cuts.add(rand(1, target - 1));
  const cs = [0, ...[...cuts].sort((a, b) => a - b), target];
  const parts = cs.slice(1).map((v, i) => v - cs[i]);
  const berries = shuffle([...parts.map(v => ({ v, key: true })), ...Array.from({ length: 4 }, () => ({ v: rand(1, Math.max(2, max - 1)), key: false }))]);
  board.innerHTML = `<div class="target"><span class="t-label">Make</span><span class="t-num">${target}</span></div><div class="sum" id="sum" aria-live="polite">Pick berries that add up to ${target}.</div><div class="berries">${berries.map((b, i) => `<button class="berry" data-i="${i}" aria-pressed="false">${b.v}</button>`).join('')}</div>`;
  ui.say(`Find berries that make ${target}. Tap again to put one back.`);
  const t0 = performance.now(), picked = new Set(), sumEl = board.querySelector('#sum'), btns = [...board.querySelectorAll('.berry')];
  return new Promise(resolve => {
    let over = false;
    board.onclick = async e => {
      const b = e.target.closest('.berry'); if (!b || over) return;
      const i = +b.dataset.i;
      if (picked.has(i)) { picked.delete(i); b.setAttribute('aria-pressed', 'false'); } else { picked.add(i); b.setAttribute('aria-pressed', 'true'); }
      const vals = [...picked].map(j => berries[j].v), sum = vals.reduce((a, c) => a + c, 0);
      sumEl.textContent = vals.length ? `${vals.join(' + ')} = ${sum}` : `Pick berries that add up to ${target}.`;
      if (sum === target) {
        over = true; sumEl.classList.add('good'); btns.forEach(x => { x.disabled = true; });
        resolve({ correct: true, ms: performance.now() - t0 });
      } else if (sum > target) {
        over = true; sumEl.classList.add('bad'); btns.forEach(x => { x.disabled = true; });
        ui.say(`${sum} is more than ${target}. Here is one way to make it.`);
        await wait(1000);
        btns.forEach((x, j) => { x.setAttribute('aria-pressed', 'false'); if (berries[j].key) x.classList.add('answer'); });
        sumEl.classList.remove('bad'); sumEl.textContent = `${parts.join(' + ')} = ${target}`;
        await wait(2000);
        resolve({ correct: false, ms: performance.now() - t0 });
      }
    };
  });
}

function moreQuestion(l) {
  const num = v => ({ label: String(v), v });
  const gens = [
    () => { const a = rand(1, 5), b = rand(1, 5); return [{ dots: a, v: a }, { dots: b, v: b }]; },
    () => { const a = rand(2, 10), b = rand(2, 10); return [{ dots: a, v: a }, { dots: b, v: b }]; },
    () => [num(rand(1, 20)), num(rand(1, 20))],
    () => { const a = rand(10, 99); return [num(a), num(Math.min(99, Math.max(10, a + rand(-12, 12))))]; },

function pairsTrial(board, l, ui) {

async function trackTrial(board, l, ui) {
  const c = TRACK(l), speed = noTimer() ? c.speed * 0.6 : c.speed;
  board.innerHTML = '<div class="arena" id="arena"></div>';
  const arena = board.querySelector('#arena'), W = arena.clientWidth || 320, H = arena.clientHeight || 280, R = 22;
  const flies = Array.from({ length: c.total }, (_, i) => {
    const b = document.createElement('button'); b.className = 'fly-btn'; b.disabled = true; b.setAttribute('aria-label', 'Firefly ' + (i + 1)); arena.appendChild(b);
    const a = Math.random() * Math.PI * 2;
    return { b, x: R + Math.random() * (W - 2 * R), y: R + Math.random() * (H - 2 * R), vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, target: i < c.targets };
  });
  const place = () => flies.forEach(f => { f.b.style.transform = `translate(${(f.x - R).toFixed(1)}px,${(f.y - R).toFixed(1)}px)`; });
  place(); flies.forEach(f => { if (f.target) f.b.classList.add('gold'); });
  ui.say(c.targets > 1 ? `Watch the ${c.targets} gold fireflies!` : 'Watch the gold firefly!');
  await wait(2000); if (!ui.alive()) return { correct: false, ms: 0 };

      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      flies.forEach(f => {
        f.x += f.vx * dt; f.y += f.vy * dt;
        if (f.x < R || f.x > W - R) { f.vx *= -1; f.x = Math.max(R, Math.min(W - R, f.x)); }
        if (f.y < R || f.y > H - R) { f.vy *= -1; f.y = Math.max(R, Math.min(H - R, f.y)); }
        if (Math.random() < 0.012) { const a = Math.random() * Math.PI * 2; f.vx = Math.cos(a) * speed; f.vy = Math.sin(a) * speed; }

      place();

    };
    requestAnimationFrame(step);
  });
  if (!ui.alive()) return { correct: false, ms: 0 };

  flies.forEach(f => { f.b.disabled = false; });
  const t0 = performance.now();
  return new Promise(resolve => {
    const picked = new Set();
    arena.onclick = async e => {
      const b = e.target.closest('.fly-btn'); if (!b || b.disabled) return;
      const f = flies.find(x => x.b === b); if (picked.has(f)) return;
      picked.add(f); b.classList.add('picked'); sfx('tap');
      if (picked.size < c.targets) return;
      flies.forEach(x => { x.b.disabled = true; });
      const ok = [...picked].every(x => x.target);
      flies.forEach(x => { if (x.target) x.b.classList.add('gold'); if (picked.has(x) && !x.target) x.b.classList.add('wrong'); });
      if (!ok) ui.say('The gold ones were here.');
      await wait(ok ? 600 : 1700);
      resolve({ correct: ok, ms: performance.now() - t0 });
    };
  });
}

    <div class="seq-chips" id="seqc" aria-live="polite"></div>

const PICS = (() => { const m = new Map(); TAGGED.forEach(it => { if (!it.n.includes(' ')) m.set(it.n, it.e); }); Object.values(WORDS).forEach(list => list.forEach(([w, e]) => m.set(w, e))); return [...m.entries()].map(([n, e]) => ({ n, e })); })();

async function play(k) {
  const my = ++token, p = P();
  S.playing = k; S.screen = 'game'; render();
  const g = GAMES[k], sk = p.skills[g.skill], start = sk.level, changes = [], times = [], results = [], began = Date.now();
  const board = $('#board');
  const ui = { say: t => { const x = tr(t), el = $('#say'); if (el) el.textContent = x; speak(x); }, alive: () => my === token };
  $('#levelnote').innerHTML = meter(sk.level);
  await showIntro(k, board, ui);
  if (!ui.alive()) return;
  for (let i = 0; i < g.trials; i++) {
    if (!ui.alive()) return;
    dots(g.trials, results);
    $('#levelnote').innerHTML = meter(sk.level);
    const r = await TRIALS[k](board, sk.level, ui);
    if (!ui.alive()) return;
    results.push(r.correct); times.push(r.ms);
    let line;
    if (r.correct) {
      sk.streak++;

      if (sk.streak >= 2) { sk.streak = 0; if (sk.level < 10) { sk.level++; changes.push({ dir: 'up', to: sk.level }); line = isHi() ? `⬆ अगला लेवल! लेवल ${sk.level}` : `⬆ Level up! Level ${sk.level}`; setTimeout(() => { sfx('up'); celebrate(); }, 250); } }
    } else {
      sk.streak = 0;
      line = (!isHi() && r.note) || pick(TRYAGAIN[isHi() ? 'hi' : 'en']); sfx('miss');
      if (sk.level > 1) { sk.level--; changes.push({ dir: 'down', to: sk.level }); line += isHi() ? ' ⬇ अगला थोड़ा आसान।' : ' ⬇ Easier next.'; }
    }
    ui.say(line); flash(r.correct); dots(g.trials, results); $('#levelnote').innerHTML = meter(sk.level);
    await wait(1400);
  }
  const entry = { ts: Date.now(), game: k, skill: g.skill, trials: g.trials, correct: results.filter(Boolean).length, results, levelStart: start, levelEnd: sk.level, changes, avgMs: Math.round(times.reduce((a, b) => a + b, 0) / times.length), durMs: Date.now() - began, strategy: null, fun: null, free: !!S.free };

app.addEventListener('input', e => {
  if (e.target.id === 'child-name' && S.draft) S.draft.name = e.target.value;
  if (e.target.id === 'fb-text' && S.fb) { S.fb.text = e.target.value; const a = $('#fb-wa'); if (a && P()) a.href = waLink(feedbackText(P())); }
});
app.addEventListener('submit', e => {
  if (e.target.id !== 'setup-form') return;
  e.preventDefault();
  const name = S.draft.name.trim();
  if (!name) { $('#name-err').textContent = 'Add a nickname so Pip can say hello.'; $('#child-name').focus(); return; }
  if (profileList().filter(p => !p.demo).length >= MAX_KIDS) { $('#name-err').textContent = `A family plan covers up to ${MAX_KIDS} children.`; return; }
  const start = { '4-6': 1, '7-9': 2, '10-13': 3 }[S.draft.band];
  const id = 'k' + Date.now();
  S.profiles[id] = { id, created: Date.now(), demo: false, child: { name, band: S.draft.band, focus: S.draft.focus.length ? S.draft.focus.slice() : ['memory', 'numbers'], minutes: S.draft.minutes, readAloud: S.draft.band === '4-6', noTimer: S.draft.band === '4-6', sounds: true }, skills: freshSkills(start), log: [], quests: {}, today: null, friends: [] };
  S.activeId = id; save(); S.screen = 'home'; render();
});

/* ---------- Ambient fireflies ---------- */
if (!reduced) {
  const sky = $('#sky');
  for (let i = 0; i < 14; i++) {
    const f = document.createElement('span'); f.className = 'fly';
    f.style.left = rand(2, 96) + '%'; f.style.top = rand(10, 95) + '%';
    f.style.animationDelay = (Math.random() * 10).toFixed(2) + 's'; f.style.animationDuration = (8 + Math.random() * 6).toFixed(2) + 's';
    sky.appendChild(f);
  }
}

/* ---------- Start (keeps place across republishes) ---------- */
function start(data) {
  if (data && data.S && data.S.profiles) { S = Object.assign(blank(), data.S); Object.values(S.profiles).forEach(normalize); } else loadSaved();
  if (S.activeId && !S.profiles[S.activeId]) S.activeId = null;
  if (!P() && !['welcome', 'setup'].includes(S.screen)) S.screen = 'welcome';
  if (S.screen === 'setup' && !S.draft) S.screen = 'welcome';
  if (['game', 'calm'].includes(S.screen)) S.screen = P() ? 'home' : 'welcome';
  if (S.screen === 'result' && !S.current) S.screen = 'home';
  render();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  window.claude.hot.snapshot(() => ({ S: Object.assign(persist(), { screen: ['game', 'calm'].includes(S.screen) ? 'home' : S.screen, current: S.current, draft: S.draft }) }));
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
